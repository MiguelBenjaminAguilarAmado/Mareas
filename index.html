var SC_PRESETS=[

function scSlug(name){return 'sc_'+(plain(name).replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'')||'x');}

function newScale(name,pre){
  var sc={id:scSlug(name),name:name.slice(0,24),icon:(pre&&pre.icon)||'chart',quiet:!!(pre&&pre.quiet),lv:pre?pre.lv.slice():['1','2','3','4','5']};

function getScale(name,label,v){

/* "Dolor: Leve (2/5) | Energía: Alta (4/5)" -> {sc_dolor:2, sc_energia:4} */
function parseScales(txt){
  var out={},n=0,re=/([^|:]+?):\s*([^|()]*?)\s*\((\d+)\s*\/\s*(\d+)\)/g,m;
  txt=String(txt||'').replace(/ /g,' ');
  while((m=re.exec(txt))){
    var name=m[1].trim(),v=+m[3],mx=+m[4];
    if(!name||!mx)continue;
    v=Math.max(1,Math.min(5,mx===5?v:Math.round(v/mx*5)));
    out[getScale(name,m[2].trim(),v).id]=v;n++;
  }
  return n?out:null;
}

  S.entries.forEach(function(e){

    if(typeof e.scales==='string'){
      var o=parseScales(e.scales);
      if(o)e.sc=Object.assign(e.sc||{},o);
      delete e.scales;ch=true;
    }
  });
  return ch;
}

async function zipEntries(file){

  for(i=tail.byteLength-22;i>=0;i--)if(v.getUint32(i,true)===0x06054b50)break;

  for(var k=0;k<cnt;k++){
    if(cd.getUint32(p,true)!==0x02014b50)break;
    var tm=cd.getUint16(p+12,true),dt=cd.getUint16(p+14,true),nl=cd.getUint16(p+28,true),el=cd.getUint16(p+30,true),cl=cd.getUint16(p+32,true);
    out.push({name:dec.decode(new Uint8Array(cd.buffer,p+46,nl)),method:cd.getUint16(p+10,true),csize:cd.getUint32(p+20,true),size:cd.getUint32(p+24,true),off:cd.getUint32(p+42,true),
      ts:new Date(((dt>>9)&127)+1980,((dt>>5)&15)-1,dt&31,(tm>>11)&31,(tm>>5)&63,(tm&31)*2).getTime()});
    p+=46+nl+el+cl;

async function zipBlob(file,e,type){

function nameTs(path){

  var r=/((?:19|20)\d\d)[-_.\/]?(0[1-9]|1[0-2])[-_.\/]?(0[1-9]|[12]\d|3[01])(?:[-_. T]?([01]\d|2[0-3])[-_.:]?([0-5]\d)(?:[-_.:]?([0-5]\d))?)?/;

/* efecto de una acción, sub-acción o persona sobre el ánimo: ánimo con vs. sin (mínimo 3 entradas en cada grupo) */
function entHas(e,k,id){return k==='p'?(e.pp||[]).indexOf(id)>-1:k==='s'?(e.sub||[]).indexOf(id)>-1:e.acts.indexOf(id)>-1;}
function eff(k,id){
  var w=[],o=[];S.entries.forEach(function(e){(entHas(e,k,id)?w:o).push(e.mood);});
  if(w.length<3||o.length<3)return null;
  var mw=mean(w),mo=mean(o);
  return {n:w.length,mw:mw,mo:mo,pct:Math.round((mw/mo-1)*100),d:mw-mo};
}
function effects(){
  var out=[];
  S.acts.forEach(function(a){var f=eff('a',a.id);if(f)out.push({k:'a',id:a.id,name:a.name,icon:a.icon,f:f});});
  S.subs.forEach(function(s){var f=eff('s',s.id);if(f){var pa=actById(s.parent);out.push({k:'s',id:s.id,name:s.name+(pa?' ('+pa.name+')':''),icon:s.icon||'star',f:f});}});
  S.people.forEach(function(p){var f=eff('p',p.id);if(f)out.push({k:'p',id:p.id,name:p.name,icon:'users',f:f});});
  return out.sort(function(a,b){return b.f.pct-a.f.pct;});
}
function insightText(name,pct){
  if(pct>=3)return '¡Estar con '+name+' hace que estés un +'+pct+'% más feliz!';
  if(pct<=-3)return 'Con '+name+' tu ánimo es un '+Math.abs(pct)+'% más bajo de media. Puede haber otros factores: mira qué hacéis juntos.';
  return 'Con '+name+' tu ánimo se mantiene como de costumbre.';
}
function bestInsight(){

  return best?insightText(best.name,best.pct):null;
}

function perClean(p){
  var o={id:String(p.id),name:String(p.name).slice(0,30),color:/^#[0-9a-fA-F]{6}$/.test(p.color)?p.color:PCOL[5],note:String(p.note||'').slice(0,1000)};
  if(pcat(p.cat))o.cat=p.cat;
  if(p.tr>=1&&p.tr<=5)o.tr=Math.round(p.tr);
  if(validD(p.bd)){o.bd=p.bd;if(p.bd.slice(5)==='02-29'&&leapOk(p.bl))o.bl=p.bl;}
  if(p.city)o.city=String(p.city).slice(0,60);
  if(p.country)o.country=String(p.country).slice(0,60);
  if(typeof p.av==='string'&&p.av.length<=AVMAX&&/^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/.test(p.av))o.av=p.av;
  if(Array.isArray(p.g)&&p.g.length)o.g=p.g.map(String).slice(0,30);
  if(Array.isArray(p.fd)){var fd=p.fd.filter(function(f){return f&&validD(f.d);}).slice(0,20).map(function(f){var r={id:String(f.id||nid('fd')),t:String(f.t||'Fecha importante').slice(0,60),d:f.d,y:!!f.y};if(r.y&&f.d.slice(5)==='02-29'&&leapOk(f.l))r.l=f.l;return r;});if(fd.length)o.fd=fd;}
  return o;
}
/* mantiene la coherencia: grupos, relaciones y vínculos de entradas y eventos solo apuntan a registros que existen */
function cleanPeople(){
  var pid={},gid={};
  pid.self=1;
  S.people.forEach(function(p){pid[p.id]=1;});
  S.pgroups.forEach(function(g){gid[g.id]=1;});
  S.people.forEach(function(p){
    if(Array.isArray(p.g)){var g=p.g.filter(function(id,i){return gid[id]&&p.g.indexOf(id)===i;});if(g.length)p.g=g;else delete p.g;}else if('g' in p)delete p.g;
    if('fd' in p&&!Array.isArray(p.fd))delete p.fd;
  });
  var seen={};
  S.rels=S.rels.filter(function(r){if(!r||!pid[r.a]||!pid[r.b]||r.a===r.b)return false;var k=[r.a,r.b].sort().join('|');if(seen[k])return false;seen[k]=1;return true;});
  function fix(o){if(!o.pp)return;if(!Array.isArray(o.pp)){delete o.pp;return;}var q=o.pp.filter(function(id){return pid[id];});if(q.length)o.pp=q;else delete o.pp;}
  S.days=S.days.filter(function(x){return x&&x.id&&x.name&&validD(x.date);});
  S.entries.forEach(fix);S.events.forEach(fix);S.days.forEach(fix);
}

/* fechas importantes: cumpleaños y fechas propias (las que se repiten cada año muestran su próxima aparición) */
function perDates(p){
  var l=[],td=todayKey();
  if(p.bd){var o=nextOccR(p.bd,p.bl||'feb28',td);if(o)l.push({t:'Cumpleaños',k:o.k,sub:o.n>0?'Cumple '+o.n:'',d:dayDiff(o.k),ic:'cake'});}
  (p.fd||[]).forEach(function(f){

/* avatar: recorte cuadrado de 192 px en JPEG, guardado dentro del estado (unos 10 KB, se sincroniza y se exporta con él) */
function procAvatar(file,cb){
  if(!file||!/^image\//.test(file.type||'')){cb(null,'Elige un archivo de imagen.');return;}
  if(file.size>25*1048576){cb(null,'La imagen pesa demasiado (máximo 25 MB).');return;}
  loadImg(file,function(src,w,h,free){
    if(!src){cb(null,'No se pudo leer la imagen (prueba con JPG o PNG).');return;}
    var s=Math.min(w,h),c=document.createElement('canvas');c.width=c.height=192;
    var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,192,192);
    try{x.drawImage(src,(w-s)/2,(h-s)/2,s,s,0,0,192,192);}catch(e){free();cb(null,'No se pudo procesar la imagen.');return;}
    free();
    var q=.82,u=c.toDataURL('image/jpeg',q);
    while(u.length>AVMAX&&q>.4){q-=.12;u=c.toDataURL('image/jpeg',q);}
    if(u.length>AVMAX||u.indexOf('data:image/jpeg')!==0){cb(null,'No se pudo reducir lo bastante la imagen.');return;}
    cb(u);
  });
}

/* ----- datos ----- */
function gFirstDates(){
  var f={};
  function up(id,t){if(!id||!(t>0))return;if(!(id in f)||t<f[id])f[id]=t;}
  S.entries.forEach(function(e){(e.pp||[]).forEach(function(id){up(id,e.ts);});});
  S.events.forEach(function(x){var t=Date.parse(x.date+'T00:00:00');(x.pp||[]).forEach(function(id){up(id,t);});});
  S.days.forEach(function(d){var t=Date.parse(d.date+'T00:00:00');(d.pp||[]).forEach(function(id){up(id,t);});});
  return f;
}
function gIdTs(id){var m=/^pe([0-9a-z]{8})/.exec(String(id));if(!m)return 0;var t=parseInt(m[1],36);return t>9e11&&t<4e12?t:0;}
function gBuildAll(){
  var fd=gFirstDates(),now=Date.now(),nodes=[],byId={},old=G.store,i;
  G.store={};
  function mk(id,type,name){
    var n=old[id]||{id:id,x:0,y:0,vx:0,vy:0,fresh:true,vis:false,born:0};
    n.type=type;n.name=name;n.fresh=!old[id];G.store[id]=n;byId[id]=n;nodes.push(n);return n;
  }
  var self=mk('self','p','Yo');self.color='';self.cat='';self.tr=0;self.gn=[];self.city='';self.country='';self.av='';
  S.people.forEach(function(p){
    var n=mk(p.id,'p',p.name);n.color=p.color;n.cat=p.cat||'';n.tr=p.tr||0;n.av=p.av||'';n.city=p.city||'';n.country=p.country||'';n.gn=[];
    var t=fd[p.id]||gIdTs(p.id)||now;n.t=t;
  });
  S.pgroups.forEach(function(g){var n=mk('g:'+g.id,'g',g.name);n.color=GGRP;n.cat='';n.tr=0;n.av='';n.gn=[g.name];n.city='';n.country='';n.members=[];});
  var links=[];
  S.rels.forEach(function(r){var a=byId[r.a],b=byId[r.b];if(a&&b&&a!==b)links.push({a:a,b:b,k:'r',t:r.t||'',w:1,id:r.id});});
  S.people.forEach(function(p){
    (p.g||[]).forEach(function(gid){var g=byId['g:'+gid],n=byId[p.id];if(g&&n){links.push({a:g,b:n,k:'m',t:'',w:1});g.members.push(n);n.gn.push(g.name);}});
  });
  var co={};
  function bump(a,b){if(a===b)return;var k=a<b?a+'|'+b:b+'|'+a;co[k]=(co[k]||0)+1;}
  function scan(pp){
    var ids=[],seen={};(pp||[]).forEach(function(id){if(byId[id]&&!seen[id]){seen[id]=1;ids.push(id);}});
    if(!ids.length)return;
    ids.forEach(function(id){bump('self',id);});
    for(i=0;i<ids.length;i++)for(var j=i+1;j<ids.length;j++)bump(ids[i],ids[j]);
  }
  S.entries.forEach(function(e){scan(e.pp);});S.events.forEach(function(x){scan(x.pp);});
  Object.keys(co).forEach(function(k){var s=k.split('|');links.push({a:byId[s[0]],b:byId[s[1]],k:'c',t:'',w:co[k]});});
  /* fechas de aparición: grupos con su primer miembro; Yo con el primer dato */
  var min=now;S.people.forEach(function(p){var n=byId[p.id];if(n.t<min)min=n.t;});
  self.t=min;
  nodes.forEach(function(n){if(n.type==='g'){var m=n.members.map(function(x){return x.t;});n.t=m.length?Math.min.apply(null,m):min;}});
  G.nodes=nodes;G.links=links;
  /* posición inicial de las nuevas: cerca de un vecino ya colocado o repartidas alrededor del centro */
  var adj={};links.forEach(function(l){(adj[l.a.id]=adj[l.a.id]||[]).push(l.b);(adj[l.b.id]=adj[l.b.id]||[]).push(l.a);});
  nodes.forEach(function(n){
    if(!n.fresh)return;
    var nb=(adj[n.id]||[]).filter(function(m){return !m.fresh;})[0],an=Math.random()*Math.PI*2;
    if(nb){n.x=nb.x+Math.cos(an)*40;n.y=nb.y+Math.sin(an)*40;}
    else{var r=40+Math.random()*(60+Math.sqrt(nodes.length)*18);n.x=Math.cos(an)*r;n.y=Math.sin(an)*r;}
    n.vx=0;n.vy=0;n.fresh=false;
  });
}

/* ----- búsqueda y filtros (sintaxis: texto, cat:, grupo:, conf:, ciudad:, pais:, tipo:, con:, y -término para excluir) ----- */
function gTerms(q){
  return String(q||'').split(/\s+/).filter(Boolean).map(function(t){
    var neg=t.charAt(0)==='-'&&t.length>1;if(neg)t=t.slice(1);
    var m=/^([A-Za-zÁÉÍÓÚáéíóúÑñ]+):(.*)$/.exec(t),key='',val=t;
    if(m){key=plain(m[1]);val=m[2];}
    return {neg:neg,key:key,val:plain(val)};
  }).filter(function(x){return x.val;});
}
function gTermOk(n,t){
  var v=t.val;
  switch(t.key){
    case 'cat':case 'categoria':{var c=pcat(n.cat);return plain(c?c[1]:'sin categoria').indexOf(v)>-1||plain(n.cat||'none').indexOf(v)===0;}
    case 'grupo':case 'group':case 'g':return (n.gn||[]).some(function(g){return plain(g).indexOf(v)>-1;});
    case 'conf':case 'confianza':{var m=/^(>=|<=|>|<|=)?(\d)$/.exec(v);if(!m)return false;var x=n.tr||0,y=+m[2],o=m[1]||'=';return o==='>='?x>=y:o==='<='?x<=y:o==='>'?x>y:o==='<'?x<y:x===y;}
    case 'ciudad':return plain(n.city).indexOf(v)>-1;
    case 'pais':return plain(n.country).indexOf(v)>-1;
    case 'tipo':case 'rel':return G.links.some(function(l){return l.k==='r'&&(l.a===n||l.b===n)&&plain(l.t).indexOf(v)>-1;});
    case 'con':return G.links.some(function(l){return l.k==='r'&&(l.a===n||l.b===n)&&plain((l.a===n?l.b:l.a).name).indexOf(v)>-1;});
    default:return plain(n.name).indexOf(t.key?t.key+':'+v:v)>-1;
  }
}
function gMatch(n,terms){for(var i=0;i<terms.length;i++){if(gTermOk(n,terms[i])===terms[i].neg)return false;}return true;}

function gFilter(){
  var c=G.cfg,terms=gTerms(c.q),pass={};
  G.nodes.forEach(function(n){
    if(n.type==='g')return;
    if(n.id==='self'&&!c.yo)return;
    if(gMatch(n,terms))pass[n.id]=1;
  });
  if(c.grp)G.nodes.forEach(function(n){
    if(n.type!=='g')return;
    if(!terms.length||n.members.some(function(m){return pass[m.id];}))pass[n.id]=1;
  });
  function lk(ids){return G.links.filter(function(l){return ids[l.a.id]&&ids[l.b.id]&&(l.k==='r'||(l.k==='m'&&c.grp)||(l.k==='c'&&c.co));});}
  var links=lk(pass);
  if(!c.orph){var deg={};links.forEach(function(l){deg[l.a.id]=1;deg[l.b.id]=1;});Object.keys(pass).forEach(function(id){if(!deg[id])delete pass[id];});links=lk(pass);}
  if(c.local&&G.sel&&pass[G.sel]){
    var reach={},front=[G.sel],d=0;reach[G.sel]=1;
    while(front.length&&d<c.depth){
      var nx=[];
      front.forEach(function(id){links.forEach(function(l){var o=l.a.id===id?l.b.id:l.b.id===id?l.a.id:'';if(o&&!reach[o]){reach[o]=1;nx.push(o);}});});
      front=nx;d++;
    }
    Object.keys(pass).forEach(function(id){if(!reach[id])delete pass[id];});links=lk(pass);
  }
  G.bset=pass;
  G.base={nodes:G.nodes.filter(function(n){return pass[n.id];}),links:links};
  if(G.sel&&!pass[G.sel])G.sel='';
  gRecolor();gTime();
}
/* aplica la línea de tiempo (si la hay) y deja listas las listas visibles para la física y el dibujo */
function gTime(){
  var cur=G.tl?G.tl.cur:Infinity,vn=[],vl=[],seen={},now=performance.now();
  G.nodes.forEach(function(n){var was=n.vis;n.vis=false;n._was=was;});
  G.base.nodes.forEach(function(n){
    if(n.t<=cur){n.vis=true;seen[n.id]=1;vn.push(n);if(!n._was&&G.tl){gSpawn(n);n.born=now;G.animUntil=now+500;}}
  });
  G.base.links.forEach(function(l){if(seen[l.a.id]&&seen[l.b.id])vl.push(l);});
  var deg={};vl.forEach(function(l){deg[l.a.id]=(deg[l.a.id]||0)+1;deg[l.b.id]=(deg[l.b.id]||0)+1;});
  vn.forEach(function(n){n.deg=deg[n.id]||0;n.r=Math.min(26,5+2.4*Math.sqrt(n.deg))*G.cfg.nsz*(n.type==='g'?1.1:n.id==='self'?1.25:1);});

  var st=document.getElementById('gStat');
  if(st)st.textContent=vn.length+(vn.length===1?' nodo':' nodos')+' · '+vl.length+(vl.length===1?' enlace':' enlaces');
  var hi=document.getElementById('gHint');
  if(hi){
    if(!vn.length){hi.hidden=false;hi.textContent='Ningún nodo coincide con los filtros.';}
    else if(!vl.length){hi.hidden=false;hi.textContent='Aún no hay conexiones visibles. Selecciona a alguien y pulsa «Añadir conexión», o activa «Co-apariciones» para verlas a partir de tus entradas.';}
    else hi.hidden=true;
  }
}
function gSpawn(n){
  var nb=null;
  G.base.links.forEach(function(l){var o=l.a===n?l.b:l.b===n?l.a:null;if(o&&o.vis&&o._was)nb=o;});
  var an=Math.random()*Math.PI*2;
  if(nb){n.x=nb.x+Math.cos(an)*30;n.y=nb.y+Math.sin(an)*30;}else{n.x=Math.cos(an)*50;n.y=Math.sin(an)*50;}
  n.vx=0;n.vy=0;
}
/* color de cada nodo: primero las reglas de «grupos de color», luego categoría o color propio */
function gRecolor(){
  var c=G.cfg,rules=c.cols.map(function(r){return {c:r.c,t:gTerms(r.q)};}).filter(function(r){return r.t.length;});
  G.nodes.forEach(function(n){
    var col=null;
    for(var i=0;i<rules.length;i++){if(gMatch(n,rules[i].t)){col=rules[i].c;break;}}
    if(!col){
      if(n.type==='g')col=GGRP;
      else if(n.id==='self')col='';
      else col=c.cby==='cat'?(GCAT[n.cat||'none']||GCAT.none):(n.color||GCAT.none);

/* ----- física de fuerzas ----- */
function gTick(){
  var c=G.cfg,n=G.vn,l=G.vl,a=G.alpha,N=n.length,i,j,A,B;
  var rep=100+c.fr*900,pull=.004+c.fc*.05,kL=.03+c.fl*.4;

function gStop(){if(G.raf)cancelAnimationFrame(G.raf);G.raf=0;if(G.ro){try{G.ro.disconnect();}catch(e){}G.ro=null;}}

  }

  if(!G.user&&G.alpha>.03&&(G.frame++%12===0))gFitTarget();

/* ----- cámara ----- */
function gFitTarget(){
  var n=G.vn;
  if(!n.length||!G.W){G.ft={k:1,tx:0,ty:0};return;}
  var x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  n.forEach(function(p){x0=Math.min(x0,p.x-p.r);x1=Math.max(x1,p.x+p.r);y0=Math.min(y0,p.y-p.r);y1=Math.max(y1,p.y+p.r+14);});
  var w=x1-x0+100,h=y1-y0+100,k=Math.max(.15,Math.min(G.W/w,G.H/h,1.8));
  G.ft={k:k,tx:-(x0+x1)/2*k,ty:-(y0+y1)/2*k};
}
function gFit(){G.user=false;gFitTarget();gWake();}
function gZoomAt(px,py,f){
  var wx=(px-G.W/2-G.tx)/G.k,wy=(py-G.H/2-G.ty)/G.k,k2=Math.max(.15,Math.min(5,G.k*f));
  G.tx=px-G.W/2-wx*k2;G.ty=py-G.H/2-wy*k2;G.k=k2;G.ft=null;G.user=true;G.dirty=true;gWake();

function gResize(){
  var cv=G.cv;if(!cv)return;
  var r=cv.getBoundingClientRect(),dpr=Math.min(2.5,window.devicePixelRatio||1);
  G.W=Math.max(1,r.width);G.H=Math.max(1,r.height);G.dpr=dpr;
  cv.width=Math.round(G.W*dpr);cv.height=Math.round(G.H*dpr);

function gLocal(e){var r=G.cv.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};}
function gHit(px,py){
  var n=G.vn,ox=G.W/2+G.tx,oy=G.H/2+G.ty;
  for(var i=n.length-1;i>=0;i--){
    var p=n[i],dx=p.x*G.k+ox-px,dy=p.y*G.k+oy-py,r=Math.max(8,p.r*G.k)+5;

/* ----- dibujo ----- */
function gDraw(ts){

  ctx.setTransform(G.dpr,0,0,G.dpr,0,0);ctx.clearRect(0,0,W,H);

  if(foc){rel={};rel[foc]=1;G.vl.forEach(function(l){if(l.a.id===foc)rel[l.b.id]=1;else if(l.b.id===foc)rel[l.a.id]=1;});}
  function bornF(n){if(!n.born)return 1;var t=(now-n.born)/450;if(t>=1)return 1;t=Math.max(0,t);return 1-Math.pow(1-t,3);}
  G.vl.forEach(function(l){
    var on=foc&&(l.a.id===foc||l.b.id===foc),bf=Math.min(bornF(l.a),bornF(l.b));
    var x1=l.a.x*k+ox,y1=l.a.y*k+oy,x2=l.b.x*k+ox,y2=l.b.y*k+oy;

    ctx.strokeStyle=on?col.accent:(l.k==='m'?GGRP:col.muted);
    ctx.lineWidth=c.lw*(l.k==='r'?1:.8)*Math.max(.7,Math.min(1.8,k))*(on?1.6:1)*(l.k==='c'?1+Math.min(2,Math.log(l.w)/2):1);

    var bf=bornF(n),dim=rel&&!rel[n.id],px=n.x*k+ox,py=n.y*k+oy,r=Math.max(2.5,n.r*k)*bf;
    if(px<-60||py<-60||px>W+60||py>H+60)return;

      else if(n.id==='self'&&r>7){ctx.fillStyle=col.ink;ctx.font='700 '+Math.round(r*.9)+'px '+G.font;ctx.fillText('Yo',px,py+r*.32);}
    }
    if(n.id===G.sel||n.id===G.hov){
      ctx.lineWidth=n.id===G.sel?3:2;ctx.strokeStyle=col.accent;ctx.beginPath();

function gImg(n){

/* ----- interacción ----- */
function gOpen(id){if(!persById(id)||id==='self')return;ui.perSel=id;ui.perN=5;ui.relDel=null;goTab('person');}
function gSelect(id){

  gSelRefresh();G.dirty=true;gWake();
}
function gBind(cv){

  });

    if(G.pinch){
      var ids=Object.keys(G.ptr);
      if(ids.length>=2){var a=G.ptr[ids[0]],b=G.ptr[ids[1]],d=Math.hypot(a.x-b.x,a.y-b.y),r=cv.getBoundingClientRect();gZoomAt((a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top,Math.max(.15,Math.min(5,G.pinch.k*d/G.pinch.d))/G.k);}

function graphBind(){
  var root=document.getElementById('gRoot'),cv=document.getElementById('gCv');
  gStop();
  if(!root||!cv){G.cv=null;return;}
  gLoad();
  G.cv=cv;G.ctx=cv.getContext('2d');G.hov='';G.drag=null;G.ptr={};G.pinch=null;G.frame=0;G.last=0;G.col=null;
  try{G.rm=window.matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){G.rm=false;}
  gColors();gBuildAll();gFilter();
  if(G.tl){G.tl=null;}
  gTlUi();
  G.user=false;
  gResize();
  if(typeof ResizeObserver!=='undefined'){G.ro=new ResizeObserver(function(){gResize();});G.ro.observe(document.getElementById('gCvw'));}
  /* calentamiento: la red llega ya casi asentada */
  G.alpha=1;G.target=0;
  for(var i=0;i<(G.seen?40:110);i++)gTick();
  G.alpha=G.rm?0:(G.seen?.35:.45);G.seen=true;
  gFitTarget();
  if(G.ft&&G.W){G.k=G.ft.k;G.tx=G.ft.tx;G.ty=G.ft.ty;G.ft=null;}
  gBind(cv);gSelRefresh();
  cv.style.cursor='grab';
  root.addEventListener('click',function(ev){
    var el=ev.target.closest?ev.target.closest('[data-g]'):null;if(!el||!root.contains(el))return;
    var a=el.getAttribute('data-g'),v=el.getAttribute('data-v');
    switch(a){
      case 'sel':if(v&&!G.bset[v]){var hi=document.getElementById('gHint');if(hi){hi.hidden=false;hi.textContent='Ese nodo está oculto por los filtros actuales.';}break;}gSelect(v);break;
      case 'open':gOpen(v);break;
      case 'local':G.cfg.local=!G.cfg.local;gSave();gFilter();gSelRefresh();gWake(.6);if(!G.user)gFitTarget();break;
      case 'zin':gZoomAt(G.W/2,G.H/2,1.3);break;
      case 'zout':gZoomAt(G.W/2,G.H/2,1/1.3);break;
      case 'fit':gFit();break;
      case 'tl':gTlToggle();break;
      case 'tlplay':if(G.tl){if(G.tl.cur>=G.tl.max){G.tl.cur=G.tl.min;gTime();}G.tl.playing=!G.tl.playing;gTlUi();gWake(.3);}break;
      case 'coladd':if(G.cfg.cols.length<12){G.cfg.cols.push({q:'',c:PCOL[(G.cfg.cols.length+3)%PCOL.length]});gSave();var b=document.getElementById('gCols');if(b)b.innerHTML=gColsHtml();}break;
      case 'coldel':G.cfg.cols.splice(+v,1);gSave();var b2=document.getElementById('gCols');if(b2)b2.innerHTML=gColsHtml();gRecolor();gWake();break;
      case 'forces':G.cfg.fc=GDEF.fc;G.cfg.fr=GDEF.fr;G.cfg.fl=GDEF.fl;G.cfg.fd=GDEF.fd;gSave();['fc','fr','fl','fd'].forEach(function(k){var i2=root.querySelector('input[data-gc="'+k+'"]'),g2=root.querySelector('[data-gv="'+k+'"]');if(i2)i2.value=G.cfg[k];if(g2)g2.textContent=gFmt(k,G.cfg[k]);});gWake(.8);break;
      case 'reset':{var cols=G.cfg.cols;G.cfg=null;try{localStorage.removeItem(GKEY);}catch(e){}G.sel='';G.user=false;render(true);break;}
    }
  });
  function onIn(ev){
    var t=ev.target;if(!t||!t.getAttribute)return;
    var key=t.getAttribute('data-gc');
    if(key){
      var v=t.type==='checkbox'?t.checked:t.type==='range'?+t.value:String(t.value);
      if(key==='q')v=v.slice(0,200);
      G.cfg[key]=v;gSave();
      var gv=root.querySelector('[data-gv="'+key+'"]');if(gv)gv.textContent=gFmt(key,v);
      if(GFILT[key]){gFilter();gSelRefresh();if(key==='local')gWake(.6);else gWake(.7);if(!G.user)gFitTarget();}
      else if(GFORCE[key])gWake(.6);
      else{gRecolor();gTime();gWake();}
      return;
    }
    var ci=t.getAttribute('data-gcol'),qi=t.getAttribute('data-gq');
    if(ci!==null&&G.cfg.cols[+ci]&&/^#[0-9a-fA-F]{6}$/.test(t.value)){G.cfg.cols[+ci].c=t.value;gSave();gRecolor();gWake();}
    else if(qi!==null&&G.cfg.cols[+qi]){G.cfg.cols[+qi].q=t.value.slice(0,80);gSave();gRecolor();gWake();}
    else if(t.id==='gTlRange'&&G.tl){G.tl.playing=false;G.tl.cur=G.tl.min+(G.tl.max-G.tl.min)*(+t.value)/1000;gTime();gTlUi();gWake(.3);}
  }
  root.addEventListener('input',onIn);
  root.addEventListener('change',onIn);
  gWake(G.alpha||.1);
}

var DTYPES=[['birthday','Cumpleaños','cake'],['anniv','Aniversario','heart'],['event','Evento','ticket'],['milestone','Hito personal','flag'],['custom','Personalizada','star']];

function pad4(y){var s=String(Math.abs(y));while(s.length<4)s='0'+s;return s;}

/* fecha de la recurrencia en un año concreto, derivada del registro original (nunca se guardan copias) */
function occIn(date,y,rule){
  var m=date.slice(5,7),d=date.slice(8,10);
  if(m==='02'&&d==='29'&&!isLeap(y)){if(rule==='skip')return null;return pad4(y)+(rule==='mar1'?'-03-01':'-02-28');}
  return pad4(y)+'-'+m+'-'+d;
}
function nextOccR(date,rule,from){
  var sy=+date.slice(0,4),y0=Math.max(sy,+from.slice(0,4));
  for(var y=y0;y<=y0+8;y++){var k=occIn(date,y,rule);if(k&&k>=from)return {k:k,n:y-sy};}
  return null;
}
/* tiempo transcurrido con aritmética de calendario desde la fecha original (sin acumular incrementos) */
function dn(y,m,d){var x=new Date(0);x.setUTCFullYear(y,m,d);return Math.round(x.getTime()/864e5);}
function addM(y,m,d,k){var t=m+k,ny=y+Math.floor(t/12),nm=((t%12)+12)%12,x=new Date(0);x.setUTCFullYear(ny,nm+1,0);return [ny,nm,Math.min(d,x.getUTCDate())];}
function elapsed(date,today){
  var p=date.split('-'),a=[+p[0],+p[1]-1,+p[2]],q=today.split('-'),t=[+q[0],+q[1]-1,+q[2]];
  var tot=dn(t[0],t[1],t[2])-dn(a[0],a[1],a[2]),fut=tot<0,s=fut?t:a,e=fut?a:t;
  var k=(e[0]-s[0])*12+(e[1]-s[1]),r=addM(s[0],s[1],s[2],k);
  if(dn(r[0],r[1],r[2])>dn(e[0],e[1],e[2])){k--;r=addM(s[0],s[1],s[2],k);}
  return {y:Math.floor(k/12),m:k%12,d:dn(e[0],e[1],e[2])-dn(r[0],r[1],r[2]),total:Math.abs(tot),future:fut};
}
function elapsedTxt(date){

function dyOcc(it,y){

function dyNext(it,from){

function dayEnd(x){

  if((v=g('dName'))!==null)fo.name=v;if((v=g('dDate'))!==null)fo.date=v;if((v=g('dCat'))!==null)fo.cat=v;if((v=g('dDesc'))!==null)fo.desc=v;if((v=g('dNote'))!==null)fo.note=v;if((v=g('dLeap'))!==null)fo.leap=v;
  var el=document.getElementById('dEl');if(el&&el.checked!==fo.el){fo.el=el.checked;fo.elTouched=true;}
  var df=document.getElementById('dDayoff'),da=document.getElementById('dDayAct'),de=document.getElementById('dEnd');if(df)fo.dayoff=df.checked;if(da)fo.dayAct=da.value;if(de)fo.end=de.value;
}
function saveDay(){
  readDay();var err=document.getElementById('fErr'),nm=fo.name.trim().slice(0,80),bad=function(t){err.textContent=t;};
  if(!nm){bad('Escribe un nombre.');return;}
  if(!validD(fo.date)){bad('Elige una fecha válida.');return;}
  var en=fo.dayoff&&fo.rec!=='yearly'&&fo.end?fo.end:'';
  if(en){
    if(!validD(en)){bad('El último día libre no es una fecha válida.');return;}
    if(en<fo.date){bad('El último día libre debe ser igual o posterior al primero.');return;}
    if(Math.round((pdate(en)-pdate(fo.date))/864e5)>365){bad('Un periodo libre no puede durar más de un año.');return;}
  }
  if(S.days.some(function(d){return d.id!==fo.id&&d.dtype===fo.dtype&&d.date===fo.date&&plain(d.name)===plain(nm);})){bad('Ya existe una fecha igual (mismo tipo, nombre y día).');return;}
  var o=fo.id?dayById(fo.id):null;if(!o){o={id:nid('dy')};S.days.push(o);}
  o.dtype=fo.dtype;o.name=nm;o.date=fo.date;o.rec=fo.rec==='yearly'?'yearly':'none';o.el=!!fo.el;
  o.dayoff=!!fo.dayoff;setOpt(o,'end',en&&en>fo.date?en:'');setOpt(o,'dayAct',o.dayoff&&actById(fo.dayAct)?fo.dayAct:'');setOpt(o,'holidaySource',fo.holidaySource||'');
  setOpt(o,'leap',dyLeapNeed()&&leapOk(fo.leap)?fo.leap:'');
  setOpt(o,'cat',DCATS.indexOf(fo.cat)>-1?fo.cat:'');setOpt(o,'desc',fo.desc.trim().slice(0,300));setOpt(o,'note',fo.note.trim().slice(0,1000));
  var pq=(fo.pp||[]).filter(function(id){return !!persById(id);});if(pq.length)o.pp=pq;else delete o.pp;
  var k=o.date;ui.calY=+k.slice(0,4);ui.calM=+k.slice(5,7)-1;
  save();closeEditor();render(true);
}
function delDay(){
  if(!fo.del){fo.del=true;readDay();renderForm();return;}
  var id=fo.id;S.days=S.days.filter(function(x){return x.id!==id;});save();closeEditor();render(true);
}
function dayClean(x){
  var o={id:String(x.id),dtype:dtype(x.dtype)[0]===x.dtype?x.dtype:'custom',name:String(x.name).slice(0,80),date:x.date,rec:x.rec==='yearly'?'yearly':'none',el:!!x.el};
  if(leapOk(x.leap))o.leap=x.leap;
  if(DCATS.indexOf(x.cat)>-1)o.cat=x.cat;
  if(x.desc)o.desc=String(x.desc).slice(0,300);
  if(x.note)o.note=String(x.note).slice(0,1000);
  if(x.dayoff)o.dayoff=true;
  if(x.dayoff&&x.rec!=='yearly'&&x.end&&validD(String(x.end))&&String(x.end)>x.date)o.end=String(x.end);
  if(x.dayAct&&S.acts.some(function(a){return a.id===String(x.dayAct);}))o.dayAct=String(x.dayAct);
  if(x.holidaySource)o.holidaySource=String(x.holidaySource).slice(0,12);
  if(Array.isArray(x.pp)&&x.pp.length)o.pp=x.pp.map(String).slice(0,30);
  return o;
}

/* estado anímico: análisis exhaustivo de tus estadísticas */
function moodLabel(avg){return avg>=4.2?['Muy bien','#30A46C']:avg>=3.5?['Bien','#52B788']:avg>=2.8?['Estable','#F5B800']:avg>=2.2?['Bajo','#F76B15']:['Muy bajo','#E5484D'];}
function moodState(days){
  var end=sod(new Date()).getTime()+864e5,from=end-days*864e5,pf=from-days*864e5,cur=[],prev=[];
  S.entries.forEach(function(e){if(e.ts>=from&&e.ts<end)cur.push(e);else if(e.ts>=pf&&e.ts<from)prev.push(e);});
  var r={days:days,n:cur.length,cur:cur,low:cur.length<5};
  if(r.low)return r;
  var mo=function(l){return l.map(function(e){return e.mood;});};
  r.avg=mean(mo(cur));r.pavg=prev.length>=3?mean(mo(prev)):null;r.trend=r.pavg===null?null:r.avg-r.pavg;
  var l7=cur.filter(function(e){return e.ts>=end-7*864e5;});r.avg7=l7.length>=2?mean(mo(l7)):null;
  var by={};cur.forEach(function(e){var k=dkey(e.ts);(by[k]=by[k]||[]).push(e.mood);});
  var dv=Object.keys(by).map(function(k){return mean(by[k]);});
  r.active=dv.length;r.cov=Math.min(1,dv.length/days);r.sd=sdev(dv);
  r.lowPct=cur.filter(function(e){return e.mood<=2;}).length/cur.length;
  r.highPct=cur.filter(function(e){return e.mood>=4;}).length/cur.length;
  var st=0,d=sod(new Date());if(!by[dkey(d.getTime())])d=addDays(d,-1);
  while(by[dkey(d.getTime())]&&mean(by[dkey(d.getTime())])<=2.5){st++;d=addDays(d,-1);}
  r.lowStreak=st;
  var wd=[[],[],[],[],[],[],[]];Object.keys(by).forEach(function(k){wd[(pdate(k).getDay()+6)%7].push(mean(by[k]));});
  r.wd=wd.map(function(a){return a.length?{a:mean(a),n:a.length}:null;});
  r.sc=[];S.scales.forEach(function(sc){
    var cv=[],pv=[];cur.forEach(function(e){if(e.sc&&e.sc[sc.id])cv.push(e.sc[sc.id]);});prev.forEach(function(e){if(e.sc&&e.sc[sc.id])pv.push(e.sc[sc.id]);});
    if(cv.length>=3)r.sc.push({sc:sc,avg:mean(cv),pavg:pv.length>=3?mean(pv):null,n:cv.length});
  });
  r.fx=effects();
  r.stress=stNow().r.i;r.stN=S.events.filter(function(x){return !x.done;}).length;
  return r;
}

async function sbUp(s,id,blob,k){

}

function putRemoteMedia(b,id,k){
  return new Promise(function(done){
    var rec={id:id,k:k==='v'?'v':'i',type:b.type||'',name:'',blob:b,size:b.size,w:0,dur:0};
    var fin=function(th){mPut(rec,th,function(ok){if(ok){if(th)MDB.th[id]=URL.createObjectURL(th);else delete MDB.th[id];}done(ok);});};
    if(rec.k==='i')loadImg(b,function(src,w,h,free){if(!src){fin(null);return;}canvasBlob(src,w,h,360,.75,function(t){free();fin(t);});});
    else procVideo(b,function(x){fin(x.thumb);});
  });
}
async function syncMedia(){
  var s=await sbToken(),m=SYM(),ids={},res={u:0,d:0,big:0,err:0};
  S.entries.forEach(function(e){(e.m||[]).forEach(function(x){ids[x.id]=x.k;});});
  var list=Object.keys(ids);
  for(var i=0;i<list.length;i++){
    var id=list[i],loc=await new Promise(function(r){mGet('m',id,r);});
    if(loc&&loc.blob){
      if(m.up[id])continue;
      if(loc.blob.size>MAXUP){res.big++;continue;}
      if(await sbUp(s,id,loc.blob,loc.k)){m.up[id]=1;res.u++;}else res.err++;
    }else{
      var b=await sbDown(s,id);
      if(b&&await putRemoteMedia(b,id,ids[id])){m.up[id]=1;res.d++;}else res.err++;
    }
    if((i+1)%5===0){SYMsave(m);cloudSay('Fotos y vídeos: '+(i+1)+' de '+list.length+'…');}
  }
  SYMsave(m);return res;
}

async function syncNow(auto){
  if(SYBUSY||!sbLoad())return;
  if(auto&&(ed||fo||inputFocused()))return;
  SYBUSY=true;cloudSay('Sincronizando…');
  try{
    var m=SYM(),rem=(await sbRest('mareas_state?select=rev,updated_at,device'))[0]||null,str=JSON.stringify(cloudPayload()),h=await sha(str),changed=h!==m.hash,conflict=null;
    if(!rem){await cloudPush(0,str,h);}
    else if(rem.rev===m.rev){if(changed&&!(await cloudPush(m.rev,str,h)))conflict=rem;}
    else if((!changed&&m.rev>0)||(m.rev===0&&!hasLocal())){await cloudPull();}
    else conflict=rem;
    if(conflict){ui.syConflict=conflict;ui.syAsk='';cloudSay('Hay cambios distintos en la nube y en este dispositivo. Elige qué hacer.');}
    else{
      ui.syConflict=null;
      var r=await syncMedia();m=SYM();m.last=Date.now();SYMsave(m);
      cloudSay('Sincronizado a las '+F_TIME.format(new Date())+(r.u||r.d?' · '+r.u+' subidos, '+r.d+' descargados':'')+(r.big?' · '+r.big+' vídeos de más de 45 MB sin subir':'')+(r.err?' · '+r.err+' archivos pendientes':'')+'.');
    }
  }catch(e){cloudSay(cloudErr(e));}
  SYBUSY=false;
  if(ui.tab==='set'&&!inputFocused())render(true);
}
async function cloudResolve(v){

  SYBUSY=false;render(true);
}

function acctStats(){
  var es=S.entries,days={},i;
  es.forEach(function(e){days[Math.round(sod(e.ts).getTime()/864e5)]=1;});
  var keys=Object.keys(days).map(Number).sort(function(a,b){return a-b;});
  var best=0,run=0;
  keys.forEach(function(k,j){run=j&&k===keys[j-1]+1?run+1:1;if(run>best)best=run;});
  var today=Math.round(sod(Date.now()).getTime()/864e5),cur=0,d=days[today]?today:today-1;
  while(days[d]){cur++;d--;}
  var last30=0;for(i=0;i<30;i++)if(days[today-i])last30++;
  var using=Math.max(1,Math.floor((sod(Date.now()).getTime()-sod(S.profile.since).getTime())/864e5)+1);
  return {entries:es.length,days:keys.length,using:using,best:best,cur:cur,cons:Math.round(last30/30*100),avg:mean(es.map(function(e){return e.mood;}))};
}

    var s=await sbToken(),r=await fetch(SBU+'/rest/v1/mareas_mcp_tokens',{method:'POST',headers:{apikey:SBK,Authorization:'Bearer '+s.at,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({name:name,scope:scope,token_hash:await sha(tok)})});

var TIDES=[['Marea viva','Constancia muy alta: tu diario está en plena marea.','#0091FF'],['Marea creciente','Vas cogiendo ritmo: sigue así y la marea seguirá subiendo.','#12A594'],['Marea baja','La marea ha bajado un poco. Un registro hoy la hace subir.','#F5B800'],['Marea calma','Marea calma: sin prisa. Cada registro la vuelve a subir y saltarte días no borra tu progreso.','#8E8E93']];
function tideInfo(){
  var dA=dayAvg(),now=sod(new Date()),skip=dA[dkey(now.getTime())]?0:1,first=null,i,n=0;
  S.entries.forEach(function(e){if(first===null||e.ts<first)first=e.ts;});
  if(first===null)return null;
  var span=Math.max(0,Math.min(30,Math.round((now.getTime()-sod(first).getTime())/864e5)+1-skip));
  if(span<1)return null;
  for(i=0;i<span;i++)if(dA[dkey(addDays(now,-(i+skip)).getTime())])n++;
  var pct=Math.round(n/span*100);
  return {n:n,span:span,pct:pct,miss:span-n,t:pct>=85?0:pct>=60?1:pct>=30?2:3,young:span<7};
}

function sleepStats(days){

  S.entries.forEach(function(e){if(!e.sl||e.ts<from)return;var k=dkey(e.ts),o=by[k]=by[k]||{h:[],q:[],t:[]};if(e.sl.h>0)o.h.push(e.sl.h);if(e.sl.q)o.q.push(e.sl.q);if(e.sl.t)o.t.push(e.sl.t);});

  if(D.length<3)return null;
  var hs=D.filter(function(d){return d.h!==null;}),qs=D.filter(function(d){return d.q!==null;}),ts=D.filter(function(d){return d.t;});

  var st={n:D.length,nh:hs.length,nt:ts.length,h:hs.length?mean(hs.map(function(d){return d.h;})):null,q:qs.length?mean(qs.map(function(d){return d.q;})):null,
    reg:ts.length?ts.filter(function(d){return d.t==='n';}).length/ts.length:null,late:ts.length?ts.filter(function(d){return d.t==='l';}).length/ts.length:null};
  st.hb=[['Menos de 6 h',function(d){return d.h<6;}],['6–7 h',function(d){return d.h>=6&&d.h<7;}],['7–8 h',function(d){return d.h>=7&&d.h<8;}],['8 h o más',function(d){return d.h>=8;}]].map(function(b){return {l:b[0],r:mm(hs.filter(b[1]))};});

var DN=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'],DF=['lunes','martes','miércoles','jueves','viernes','sábado','domingo'];
function tmin(t){var p=String(t||'').split(':');return (+p[0])*60+(+p[1]||0);}
function tfmt(m){return pad(Math.floor(m/60))+':'+pad(m%60);}
function wdayOf(d){return (new Date(d).getDay()+6)%7;}
function curWeek(){
  if(!S.sched.ab)return '';
  var n=Math.round((mondayOf(new Date())-mondayOf(new Date(S.sched.ref)))/(7*864e5));
  return (((n%2)+2)%2)===0?'A':'B';
}
function viewWk(){return S.sched.ab?(ui.schWk||curWeek()):'';}
function clsFor(day,wk){
  return S.classes.filter(function(c){return (day===null||c.day===day)&&(!S.sched.ab||!c.week||c.week===wk)&&subjById(c.sid);}).sort(function(a,b){return a.day-b.day||tmin(a.start)-tmin(b.start);});
}
function schDate(wd,wk){
  var base=mondayOf(new Date());
  if(S.sched.ab&&wk&&wk!==curWeek())base=addDays(base,7);
  return dkey(addDays(base,wd).getTime());
}
function schDay(){
  if(ui.schDay!==undefined&&ui.schDay!==null&&ui.schDay<S.sched.days)return ui.schDay;
  var w=wdayOf(Date.now());return w<S.sched.days?w:0;
}
function clsRow(c,now){
  var sj=subjById(c.sid),t=sj.teacher?teachById(sj.teacher):null,sub=[c.room?('Aula '+c.room):'',t?t.name:''].filter(Boolean).join(' · ');
  var live=now&&tmin(c.start)<=now&&now<tmin(c.end);
  var past=now>0&&tmin(c.end)<=now;
  if(past)return '<button class="card crow past-class" style="--cc:'+esc(sj.color)+'" data-a="editCls" data-v="'+esc(c.id)+'" aria-label="Clase terminada: '+esc(sj.name)+'"><span class="sbadge" style="background:'+esc(sj.color)+';width:32px;height:32px">'+ic(sj.icon||'book',18)+'</span></button>';
  return '<button class="card crow" style="--cc:'+esc(sj.color)+'" data-a="editCls" data-v="'+esc(c.id)+'"><span class="ctime"><b>'+esc(c.start)+'</b><span class="small muted">'+esc(c.end)+'</span></span><span class="mid"><b>'+esc(sj.name)+'</b>'+(sub?'<span class="small muted">'+esc(sub)+'</span>':'')+'</span>'+(live?'<span class="nowbadge">Ahora</span>':'')+(S.sched.ab&&c.week?'<span class="chip">'+esc(c.week)+'</span>':'')+'</button>';

function weekGrid(wk){
  var nd=S.sched.days,cls=clsFor(null,wk).filter(function(c){return c.day<nd;}),fr=[];
  for(var q=0;q<nd;q++)fr.push(freeOn(schDate(q,wk)));

      return '<button class="cb" style="top:'+top+'px;height:'+ht+'px;background:'+esc(sj.color)+'" data-a="editCls" data-v="'+esc(c.id)+'" aria-label="'+esc(sj.name+' '+DF[c.day]+' '+c.start+' a '+c.end)+'"><b>'+esc(sj.name)+'</b>'+(c.room&&ht>34?'<span>'+esc(c.room)+'</span>':'')+'</button>';

  var a=tmin(fo.start),b=tmin(fo.end);

function saveForm(){

/* stats */
function buckets(range){
  var out=[],end=sod(new Date()),i,d,e;
  if(range<=30){for(i=range-1;i>=0;i--){d=addDays(end,-i);out.push({s:d.getTime(),e:addDays(d,1).getTime(),l:F_DAYS.format(d)});}}
  else if(range===90){var mon=mondayOf(end);for(i=12;i>=0;i--){d=addDays(mon,-7*i);out.push({s:d.getTime(),e:addDays(d,7).getTime(),l:F_DAYS.format(d)});}}
  else{for(i=11;i>=0;i--){d=new Date(end.getFullYear(),end.getMonth()-i,1);e=new Date(end.getFullYear(),end.getMonth()-i+1,1);out.push({s:d.getTime(),e:e.getTime(),l:F_MON.format(d)});}}
  return out;
}
function streaks(){
  var ks={};S.entries.forEach(function(e){ks[dkey(e.ts)]=1;});
  var cur=0,d=sod(new Date());
  if(!ks[dkey(d.getTime())])d=addDays(d,-1);
  while(ks[dkey(d.getTime())]){cur++;d=addDays(d,-1);}
  var days=Object.keys(ks).sort(),best=0,run=0,prev=null;
  days.forEach(function(k){var p=k.split('-'),t=new Date(+p[0],+p[1]-1,+p[2]).getTime();
    if(prev!==null&&Math.round((t-prev)/86400000)===1)run++;else run=1;
    if(run>best)best=run;prev=t;});
  return {cur:cur,best:best};
}
function chartSvg(bks,list){
  var W=340,H=176,L=20,R=4,T=8,B=22,pw=W-L-R,ph=H-T-B,n=bks.length,slot=pw/n,bw=Math.max(3,slot*.68);
  function y(v){return T+ph*(1-v/5);}
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Ánimo medio por periodo">';
  for(var v=1;v<=5;v++)s+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'"/><text x="'+(L-6)+'" y="'+(y(v)+3.5)+'" text-anchor="end">'+v+'</text>';
  bks.forEach(function(b,i){
    var arr=list.filter(function(e){return e.ts>=b.s&&e.ts<b.e;});
    if(!arr.length)return;
    var a=arr.reduce(function(t,e){return t+e.mood;},0)/arr.length,x=L+slot*i+(slot-bw)/2;
    s+='<rect x="'+x.toFixed(1)+'" y="'+y(a).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+(y(0)-y(a)).toFixed(1)+'" rx="'+Math.min(4,bw/2).toFixed(1)+'" fill="var(--m'+Math.round(a)+')"/>';
    s+='<rect x="'+(L+slot*i).toFixed(1)+'" y="'+T+'" width="'+slot.toFixed(1)+'" height="'+ph+'" fill="transparent" data-a="barGo" data-v="'+b.s+'" style="cursor:pointer"><title>'+esc(b.l+' · ánimo '+num(a)+' · '+arr.length+(arr.length===1?' entrada':' entradas')+' (toca para ver el calendario)')+'</title></rect>';
  });
  s+='<text x="'+L+'" y="'+(H-5)+'">'+esc(bks[0].l)+'</text><text x="'+(W-R)+'" y="'+(H-5)+'" text-anchor="end">'+esc(bks[n-1].l)+'</text></svg>';
  return s;
}
function sfOk(e){return (!ui.sfA||e.acts.indexOf(ui.sfA)>-1)&&(!ui.sfP||(e.pp||[]).indexOf(ui.sfP)>-1);}
function periodCmp(list,prev,from,span){
  if(list.length<3||prev.length<3)return '<section class="card stack"><h3>Comparación con el periodo anterior</h3><p class="muted small" style="margin:0">Hacen falta al menos 3 registros en cada periodo para comparar (ahora: '+list.length+' en este y '+prev.length+' en el anterior).</p></section>';
  var m1=mean(list.map(function(e){return e.mood;})),m0=mean(prev.map(function(e){return e.mood;})),d=m1-m0;
  var dd=function(l){var o={};l.forEach(function(e){o[dkey(e.ts)]=1;});return Object.keys(o).length;};
  var d1=dd(list),d0=dd(prev),sg=function(x){return (x>=0?'+':'−')+num(Math.abs(x));};
  var txt=Math.abs(d)<.3?'Tu ánimo medio es parecido al del periodo anterior.':d>0?'Tu ánimo medio ha subido respecto al periodo anterior.':'Tu ánimo medio ha bajado respecto al periodo anterior.';
  var lo=function(l){return Math.round(l.filter(function(e){return e.mood<=2;}).length/l.length*100);};
  return '<section class="card stack"><h3>Comparación con el periodo anterior</h3><div class="tiles"><div class="tile"><b>'+num(m1)+'</b><span class="small muted">ánimo medio ('+sg(d)+')</span></div><div class="tile"><b>'+list.length+'</b><span class="small muted">entradas (antes '+prev.length+')</span></div><div class="tile"><b>'+d1+'</b><span class="small muted">días con registro (antes '+d0+')</span></div></div><p style="margin:0">'+txt+' Registros bajos (Fatal o Mal): '+lo(list)+'% frente a '+lo(prev)+'%.</p><p class="muted small" style="margin:0">Compara '+esc(F_DAYS.format(new Date(from)))+' – hoy con el mismo tramo anterior. Con pocos días registrados las medias pueden engañar.</p></section>';
}
function withWithout(list){
  var rows=[];
  S.acts.forEach(function(a){
    var w=[],o=[];list.forEach(function(e){(e.acts.indexOf(a.id)>-1?w:o).push(e.mood);});

  });
  rows.sort(function(x,y){return y.d-x.d;});
  var h='<section class="card stack"><h3>Actividades y ánimo</h3>';
  if(!rows.length)h+='<p class="muted small" style="margin:0">Aún no hay datos suficientes: cada actividad necesita al menos 3 entradas con ella y 3 sin ella en este periodo. No se saca ninguna conclusión con menos.</p>';

  return h+'</div><p class="muted small" style="margin:0">Son asociaciones estadísticas, no causas demostradas. Más análisis con todo tu historial en «Estado».</p></section>';

};
var DY_CATS={emociones:'Emociones',sueno:'Sueño',tiempo:'Tiempo'};
var DY_MOOD={'increible':5,'genial':5,'excelente':5,'rad':5,'bien':4,'muy bien':4,'good':4,'meh':3,'regular':3,'neutral':3,'mal':2,'muy mal':2,'bad':2,'horrible':1,'fatal':1,'terrible':1,'awful':1};
function plain(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();}
function parseCSV(t){
  if(t.charCodeAt(0)===0xFEFF)t=t.slice(1);
  var rows=[],row=[],f='',q=false,c;
  for(var i=0;i<t.length;i++){
    c=t.charAt(i);
    if(q){if(c==='"'){if(t.charAt(i+1)==='"'){f+='"';i++;}else q=false;}else f+=c;}
    else if(c==='"')q=true;
    else if(c===','){row.push(f);f='';}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t.charAt(i+1)==='\n')i++;row.push(f);f='';rows.push(row);row=[];}
    else f+=c;
  }
  if(f!==''||row.length){row.push(f);rows.push(row);}
  return rows.filter(function(r){return r.length>1||(r[0]||'')!=='';});
}
function cleanNote(s){
  return String(s||'').replace(/<br\s*\/?>/gi,'\n').replace(/<\/(p|div)>/gi,'\n').replace(/<[^>]+>/g,'')
    .replace(/&nbsp;/g,' ').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&amp;/g,'&')
    .replace(/ /g,' ').replace(/[ \t]+\n/g,'\n').replace(/\n{3,}/g,'\n\n').trim();
}
function ensureCat(id){
  if(S.cats.some(function(c){return c.id===id;}))return id;
  if(DY_CATS[id]){S.cats.push({id:id,name:DY_CATS[id]});return id;}
  return 'otras';
}
function dyAct(name,stats){
  var key=name.toLowerCase(),m=DY_MAP[key],i,found;
  if(m&&m[2]&&actById(m[2]))return m[2];
  for(i=0;i<S.acts.length;i++)if(S.acts[i].name.toLowerCase()===key)return S.acts[i].id;
  var id='dy_'+(plain(name).replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'')||'x');
  found=actById(id);if(found)return id;
  var label=name.charAt(0).toUpperCase()+name.slice(1);
  S.acts.push({id:id,name:label.slice(0,24),icon:m&&ICONS[m[1]]?m[1]:'star',cat:m?ensureCat(m[0]):'otras'});touch();
  stats.newActs++;return id;
}
function doDaylio(text){
  var rows=parseCSV(String(text||''));
  if(rows.length<2){ui.dyMsg='El archivo está vacío o no es un CSV.';return false;}
  var head=rows[0].map(function(h){return plain(h);});
  var ix={};['full_date','time','mood','activities','scales','note_title','note'].forEach(function(k){ix[k]=head.indexOf(k);});
  if(ix.full_date<0||ix.mood<0){ui.dyMsg='No parece un CSV exportado desde Daylio.';return false;}
  var ids={};S.entries.forEach(function(e){ids[e.id]=1;});
  var sc0=S.scales.length,stats={add:0,dup:0,skip:0,newActs:0},g=function(r,k){return ix[k]>-1?(r[ix[k]]||''):'';},last=0;
  for(var n=1;n<rows.length;n++){
    var r=rows[n],dm=/^(\d{4})-(\d{2})-(\d{2})$/.exec(g(r,'full_date').trim()),tm=/^(\d{1,2}):(\d{2})/.exec(g(r,'time').trim()),mood=DY_MOOD[plain(g(r,'mood'))];
    if(!dm||!mood){stats.skip++;continue;}
    var ts=new Date(+dm[1],+dm[2]-1,+dm[3],tm?+tm[1]:12,tm?+tm[2]:0).getTime();
    if(isNaN(ts)){stats.skip++;continue;}
    var id='dy_'+ts;
    if(ids[id]){stats.dup++;continue;}
    var seen={},acts=[];
    g(r,'activities').split('|').forEach(function(a){a=a.trim();if(!a)return;var aid=dyAct(a,stats);if(!seen[aid]){seen[aid]=1;acts.push(aid);}});
    var en={id:id,ts:ts,mood:mood,acts:acts,note:cleanNote(g(r,'note')).slice(0,20000),title:cleanNote(g(r,'note_title')).slice(0,120)};
    var so=parseScales(g(r,'scales'));if(so)en.sc=so;
    ids[id]=1;S.entries.push(en);stats.add++;if(ts>last)last=ts;
  }
  var removed=0;
  if(stats.add>0){
    removed=S.entries.filter(function(e){return e.ex;}).length;
    S.entries=S.entries.filter(function(e){return !e.ex;});
    S.goals=S.goals.filter(function(x){return !x.ex;});
    var ld=new Date(last);ui.calY=ld.getFullYear();ui.calM=ld.getMonth();ui.calSel=dkey(last);
  }
  save();
  ui.dyMsg='Importadas '+stats.add+' entradas'+(stats.newActs?' y '+stats.newActs+' actividades nuevas':'')+'.'+(S.scales.length>sc0?' Escalas nuevas: '+S.scales.slice(sc0).map(function(x){return x.name;}).join(', ')+'.':'')+
    (stats.dup?' '+stats.dup+' ya estaban.':'')+(stats.skip?' '+stats.skip+' no se pudieron leer.':'')+(removed?' Se quitaron '+removed+' entradas de ejemplo.':'');
  return stats.add>0||stats.dup>0;
}

document.addEventListener('keydown',function(ev){
  // Manejo de lightbox
  if($lb.classList.contains('open')){
    if(ev.key==='Escape')closeLb();
    else if(ev.key==='ArrowLeft')lbGo(-1);
    else if(ev.key==='ArrowRight')lbGo(1);
    return;
  }

  // Manejo de paleta de comandos activa
  if($cmdPal&&$cmdPal.classList.contains('open')){
    if(ev.key==='Escape'){ev.preventDefault();closeCmdPal();return;}
    if(ev.key==='ArrowDown'){ev.preventDefault();cmdMove(1);return;}
    if(ev.key==='ArrowUp'){ev.preventDefault();cmdMove(-1);return;}
    if(ev.key==='Home'&&ev.target&&ev.target.id!=='cmdInput'){ev.preventDefault();ui.cmdSel=0;cmdMove(0);return;}
    if(ev.key==='Enter'&&!ev.isComposing){ev.preventDefault();execCmdItem(cmdCache[ui.cmdSel]);return;}
  }

  // Cerrar editor / formulario con Escape
  if(ev.key==='Escape'&&(ed||fo||$sheet.classList.contains('open'))){closeEditor();return;}
  if(ev.key==='Escape'){ev.preventDefault();if(!goBack('more')){ui.tab='more';render();}return;}

  // Atajos con modificador Cmd o Ctrl
  var isMod=ev.metaKey||ev.ctrlKey;
  if(isMod){
    var k=ev.key.toLowerCase();
    // Cmd/Ctrl + K: Paleta de comandos y búsqueda global
    if(k==='k'){
      ev.preventDefault();
      if($cmdPal.classList.contains('open'))closeCmdPal();
      else openCmdPal();
      return;
    }
    // Cmd/Ctrl + N: Nueva entrada rápida
    if(k==='n'){
      ev.preventDefault();
      if($cmdPal.classList.contains('open'))closeCmdPal();
      openEditor({});
      return;
    }
  }

  // Teclas numéricas 1-5: Asignación rápida de nivel de ánimo
  // Solo cuando no estemos escribiendo en inputs, textareas o selects
  var tag=(ev.target&&ev.target.tagName)?ev.target.tagName.toLowerCase():'';
  var isEditing=tag==='input'||tag==='textarea'||tag==='select'||(ev.target&&ev.target.isContentEditable);
  if(!isEditing&&!ev.metaKey&&!ev.ctrlKey&&!ev.altKey){
    if(ev.key>='1'&&ev.key<='5'){
      var moodNum=+ev.key;
      // Si el editor de entrada está abierto, asignar el ánimo en el editor
      if(ed&&$sheet.classList.contains('open')){
        ev.preventDefault();
        ed.mood=moodNum;
        $sheet.querySelectorAll('[data-a="mood"]').forEach(function(b){b.classList.toggle('sel',b.getAttribute('data-v')===String(moodNum));});
        return;
      }
      // Si estamos en cualquier pantalla, abrir registro rápido con ese ánimo
      if(!ed&&!fo&&!$sheet.classList.contains('open')&&!$cmdPal.classList.contains('open')){
        ev.preventDefault();
        openEditor({mood:moodNum});
        return;
      }
    }
  }
});
