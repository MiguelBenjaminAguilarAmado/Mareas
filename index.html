<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#201d1d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
<title>Mareas</title>
<style>
/* Layout: one column app shell (max 520px), scrolling content, bottom tab bar, entry editor as a bottom sheet.
   One DOM, three skins. The base rules below are the Minimalista skin (flat, no effects, cheapest to paint);
   [data-skin="glass"] and [data-skin="android"] layers add Liquid Glass and Android on top. */
:root{
  --bg:#FAFAFA; --surface:#FFFFFF; --surface2:#F0F0F0; --fg:#171717; --muted:#666666; --line:#E4E4E4;
  --accent:#171717; --accent-ink:#FFFFFF; --accent-soft:#EBEBEB; --danger:#B42318; --ink:#1B1830;
  --m1:#7F7BC4; --m2:#6A9FCF; --m3:#6DB39D; --m4:#DDB04C; --m5:#E5855A;
  --font:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --r:12px; --sw:1.6;
  --glass:#FFFFFF; --glass-hi:#FFFFFF; --glass-low:#F0F0F0; --glass-edge:#E4E4E4; --glass-sheet:#FAFAFA; --glass-list:#FFFFFF;
  --sheen:transparent; --glass-shadow:rgba(0,0,0,.12);
  --b1:#FAFAFA; --b2:#FAFAFA; --b3:#FAFAFA; --b4:#FAFAFA;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F0F0F; --surface:#181818; --surface2:#232323; --fg:#EDEDED; --muted:#9A9A9A; --line:#2B2B2B;
    --accent:#EDEDED; --accent-ink:#0F0F0F; --accent-soft:#2A2A2A; --danger:#F97066;
    --glass:#181818; --glass-hi:#181818; --glass-low:#232323; --glass-edge:#2B2B2B; --glass-sheet:#0F0F0F; --glass-list:#181818;
    --glass-shadow:rgba(0,0,0,.5); --b1:#0F0F0F; --b2:#0F0F0F; --b3:#0F0F0F; --b4:#0F0F0F;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F0F0F; --surface:#181818; --surface2:#232323; --fg:#EDEDED; --muted:#9A9A9A; --line:#2B2B2B;
  --accent:#EDEDED; --accent-ink:#0F0F0F; --accent-soft:#2A2A2A; --danger:#F97066;
  --glass:#181818; --glass-hi:#181818; --glass-low:#232323; --glass-edge:#2B2B2B; --glass-sheet:#0F0F0F; --glass-list:#181818;
  --glass-shadow:rgba(0,0,0,.5); --b1:#0F0F0F; --b2:#0F0F0F; --b3:#0F0F0F; --b4:#0F0F0F;
  color-scheme:dark;
}

/* Liquid Glass tokens: sky blue */
:root[data-skin="glass"]{
  --font:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Segoe UI',system-ui,sans-serif; --sw:1.7; --r:26px;
  --bg:#E8F4FD; --surface:#FFFFFF; --surface2:#DDEBF8; --fg:#0E2236; --muted:#566E87; --line:#CFE2F3;
  --accent:#0A74D6; --accent-ink:#FFFFFF; --accent-soft:#D5EAFF; --danger:#C0362C;
  --m1:#8F8DE8; --m2:#5FA8F2; --m3:#55CBBE; --m4:#F3C75B; --m5:#FF9068;
  --glass:rgba(255,255,255,.48); --glass-hi:rgba(255,255,255,.74); --glass-low:rgba(255,255,255,.30); --glass-edge:rgba(255,255,255,.88);
  --glass-sheet:rgba(238,247,255,.84); --glass-list:rgba(255,255,255,.60); --sheen:rgba(255,255,255,.70); --glass-shadow:rgba(25,95,165,.18);
  --b1:#8CCDFF; --b2:#C2E8FF; --b3:#A9C6FF; --b4:#BFF0F2;
}
@media (prefers-color-scheme: dark){
  :root[data-skin="glass"]:not([data-theme="light"]){
    --bg:#06121E; --surface:#0E2236; --surface2:#15304A; --fg:#E6F2FF; --muted:#8CA7C2; --line:#1C3853;
    --accent:#5DB8FF; --accent-ink:#04121F; --accent-soft:#12365A; --danger:#FF8A80;
    --glass:rgba(14,38,64,.52); --glass-hi:rgba(40,88,136,.58); --glass-low:rgba(255,255,255,.06); --glass-edge:rgba(160,210,255,.20);
    --glass-sheet:rgba(8,26,44,.84); --glass-list:rgba(16,44,74,.62); --sheen:rgba(190,225,255,.15); --glass-shadow:rgba(0,0,0,.5);
    --b1:#0C4A7E; --b2:#08304F; --b3:#17408F; --b4:#0A5560;
    color-scheme:dark;
  }
}
:root[data-skin="glass"][data-theme="dark"]{
  --bg:#06121E; --surface:#0E2236; --surface2:#15304A; --fg:#E6F2FF; --muted:#8CA7C2; --line:#1C3853;
  --accent:#5DB8FF; --accent-ink:#04121F; --accent-soft:#12365A; --danger:#FF8A80;
  --glass:rgba(14,38,64,.52); --glass-hi:rgba(40,88,136,.58); --glass-low:rgba(255,255,255,.06); --glass-edge:rgba(160,210,255,.20);
  --glass-sheet:rgba(8,26,44,.84); --glass-list:rgba(16,44,74,.62); --sheen:rgba(190,225,255,.15); --glass-shadow:rgba(0,0,0,.5);
  --b1:#0C4A7E; --b2:#08304F; --b3:#17408F; --b4:#0A5560;
  color-scheme:dark;
}

/* Android tokens: tonal green surfaces */
:root[data-skin="android"]{
  --font:Roboto,'Google Sans','Segoe UI',system-ui,sans-serif; --sw:2; --r:20px;
  --bg:#F7FAF4; --surface:#EAF0E6; --surface2:#DCE5D8; --fg:#181D19; --muted:#4A574D; --line:#BCC8BC;
  --accent:#006C4D; --accent-ink:#FFFFFF; --accent-soft:#C2EDD7; --danger:#BA1A1A;
  --m1:#9B8AD6; --m2:#6BA6E5; --m3:#5DC3A0; --m4:#EFC24D; --m5:#F28B66;
}
@media (prefers-color-scheme: dark){
  :root[data-skin="android"]:not([data-theme="light"]){
    --bg:#0F1511; --surface:#1B211C; --surface2:#262D27; --fg:#DFE4DC; --muted:#A5B0A6; --line:#404941;
    --accent:#6FDBB0; --accent-ink:#003826; --accent-soft:#264A3A; --danger:#FFB4AB;
    color-scheme:dark;
  }
}
:root[data-skin="android"][data-theme="dark"]{
  --bg:#0F1511; --surface:#1B211C; --surface2:#262D27; --fg:#DFE4DC; --muted:#A5B0A6; --line:#404941;
  --accent:#6FDBB0; --accent-ink:#003826; --accent-soft:#264A3A; --danger:#FFB4AB;
  color-scheme:dark;
}


/* Open-Code tokens: warm dark terminal, Apple HIG semantic colors */
:root[data-skin="opencode"]{
  --font:'Berkeley Mono','JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace; --sw:1.6; --r:4px;
  --bg:#201d1d; --surface:#2a2626; --surface2:#332f2f; --fg:#fdfcfc; --muted:#9a9898; --line:#423e3e;
  --accent:#007aff; --accent-ink:#fdfcfc; --accent-soft:#12304f; --danger:#ff3b30;
  --m1:#5e5ce6; --m2:#0a84ff; --m3:#30d158; --m4:#ffd60a; --m5:#ff9f0a;
  --glass:#2a2626; --glass-hi:#2a2626; --glass-low:#332f2f; --glass-edge:#423e3e; --glass-sheet:#201d1d; --glass-list:#2a2626;
  --sheen:transparent; --glass-shadow:rgba(0,0,0,.4);
  --b1:#201d1d; --b2:#201d1d; --b3:#201d1d; --b4:#201d1d;
  color-scheme:dark;
}
[data-skin="opencode"] body{font-size:14px;line-height:1.6}
[data-skin="opencode"] .card,[data-skin="opencode"] .entry,[data-skin="opencode"] .btn,[data-skin="opencode"] .field,[data-skin="opencode"] .fchip,[data-skin="opencode"] .act,[data-skin="opencode"] .chip,[data-skin="opencode"] .banner,[data-skin="opencode"] .seg,[data-skin="opencode"] .sheetbox,[data-skin="opencode"] .skin,[data-skin="opencode"] .mth,[data-skin="opencode"] .sk-prev,[data-skin="opencode"] .orb{border-radius:4px}
[data-skin="opencode"] .sheetbox{border-radius:4px 4px 0 0}
[data-skin="opencode"] .card{box-shadow:none;border:1px solid var(--line)}
[data-skin="opencode"] .brand::before{content:"$ ";color:var(--m3)}
[data-skin="opencode"] .today{text-transform:lowercase}
[data-skin="opencode"] h2,[data-skin="opencode"] h3{letter-spacing:0;text-transform:none}
[data-skin="opencode"] .btn{font-weight:600;padding-inline:20px;letter-spacing:0}
[data-skin="opencode"] .btn.ghost{border:1.5px solid var(--line);background:none;color:var(--fg)}
[data-skin="opencode"] .btn:active{transform:translateY(1px)}
[data-skin="opencode"] a{text-decoration:underline;color:var(--accent)}
[data-skin="opencode"] #tabs{border-top:1px solid var(--line);background:var(--bg)}
[data-skin="opencode"] .muted{color:var(--muted)}

*{box-sizing:border-box}
html,body{height:100%}
html{-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;touch-action:manipulation}
input,textarea,select{font:inherit;color:var(--fg)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.ic{display:block;flex:none;fill:none;stroke:currentColor;stroke-width:var(--sw);stroke-linecap:round;stroke-linejoin:round}
#sprite{position:absolute;width:0;height:0;overflow:hidden}

#app{height:100%;max-width:520px;margin:0 auto;padding-inline:16px;display:flex;flex-direction:column}
#view{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-block:14px 12px;display:flex;flex-direction:column;gap:12px;scrollbar-width:thin}
#view>*{flex:none}

/* header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.ttl{display:flex;flex-direction:column;min-width:0}
.today{order:-1;color:var(--muted);font-size:12px;text-transform:capitalize}
.brand{font-weight:700;font-size:24px;line-height:1.15;letter-spacing:-.02em}
.orb{display:none}
h2{font-size:19px;font-weight:700;margin:0;letter-spacing:-.01em}
h3{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.big{font-size:28px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.cathead{font-size:13px;font-weight:600;color:var(--muted);padding-left:2px}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}

/* quick mood */
.quick{display:flex;flex-direction:column;gap:12px}
.faces{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.facebtn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 2px;border-radius:10px;font-size:12px;color:var(--muted);border:2px solid transparent}
.facebtn svg{width:100%;max-width:52px;height:auto}
.facebtn.sel{border-color:var(--accent);color:var(--fg);background:var(--accent-soft)}

/* banner and buttons */
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 16px;border-radius:8px;font-weight:600;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface2);color:var(--fg)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px}
.btn.wide{width:100%}
.more{align-self:center}

/* entries */
.day{display:flex;flex-direction:column;gap:8px}
.entry{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;text-align:left;width:100%;align-items:start;content-visibility:auto;contain-intrinsic-size:auto 96px}
.entry:focus-visible{outline-offset:-3px}
.entry .when{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.entry .name{font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;background:var(--surface2);border-radius:999px;padding:3px 10px 3px 7px;color:var(--muted)}
.note{margin:6px 0 0;font-size:14px;overflow-wrap:anywhere;white-space:pre-wrap}
.entry .note{display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}

/* filters and calendar */
.fchip{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);border:2px solid transparent;opacity:.75}
.fchip.on{border-color:var(--accent);opacity:1}
select.field{appearance:auto}
.bdg{position:absolute;top:2px;right:4px;font-size:9px;line-height:1;font-weight:700;opacity:.8}
.ygrid{display:grid;grid-template-columns:22px repeat(12,minmax(0,1fr));gap:3px;align-items:center}
.ygrid .yl{font-size:10px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.ygrid button,.ygrid i{height:15px;border-radius:4px;background:var(--surface2);display:block}
.ygrid i.nx{background:none}
.ygrid button.now{outline:2px solid var(--fg);outline-offset:0}
.cal-head{display:flex;align-items:center;justify-content:space-between}
.iconbtn{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--surface2)}
.iconbtn[disabled]{opacity:.35;cursor:default}
.month{font-weight:700;font-size:19px;text-transform:capitalize}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dow{font-size:11px;text-align:center;color:var(--muted);font-weight:600}
.cell{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;background:var(--surface2);color:var(--muted);border:2px solid transparent;position:relative}
.cell.has{color:var(--ink)}
.cell.blank{background:none}
.cell.fut{opacity:.45}
.cell.now{border-color:var(--fg)}
.cell.sel{outline:3px solid var(--accent);outline-offset:1px}
.legend{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{width:14px;height:14px;border-radius:5px;display:inline-block}

/* stats */
.seg{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface2);border-radius:10px;padding:3px;gap:3px}
.seg button{min-height:36px;border-radius:8px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg)}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi b{font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--font)}
.chart .grid{stroke:var(--line);stroke-width:1}
.dist{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px}
.dist i{display:block;min-width:0}
.drow{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;font-size:14px}
.drow svg{width:28px;height:28px}
.srow{display:grid;grid-template-columns:minmax(0,5.5em) 1fr auto;gap:10px;align-items:center;font-size:13px}
.srow span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px}
.arow{display:grid;grid-template-columns:22px minmax(0,1fr) 110px 40px;gap:10px;align-items:center;font-size:14px}
.arow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.div{position:relative;height:10px;background:var(--surface2);border-radius:5px}
.div::before{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:2px;background:var(--muted);opacity:.5}
.div i{position:absolute;top:0;bottom:0;border-radius:5px}
.delta{font-variant-numeric:tabular-nums;font-weight:600;text-align:right;font-size:13px}

/* scales */
.sc{display:flex;flex-direction:column;gap:8px}
.sclv{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.sclv button{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.sclv button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sclv input.field{min-height:40px;padding:6px 4px;text-align:center;font-size:13px}

/* settings */
.arow-s{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.arow-s:last-child{border-bottom:0}
.field{width:100%;min-height:44px;border-radius:8px;border:1px solid var(--line);background:var(--surface);padding:10px 12px}
textarea.field{min-height:96px;resize:vertical}
.ipw{max-height:300px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:2px;scrollbar-width:thin}
.iconpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.iconpick button{height:44px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);color:var(--muted);border:2px solid transparent}
.iconpick button.on{border-color:var(--accent);color:var(--fg);background:var(--accent-soft)}
.msg{font-size:13px;color:var(--muted)}
.skins{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:10px}
.skin{display:flex;flex-direction:column;gap:6px;text-align:left;padding:8px;border-radius:12px;border:2px solid var(--line);background:var(--surface2)}
.skin.on{border-color:var(--accent)}
.skin b{display:block;font-size:14px}
.sk-prev{display:block;position:relative;height:66px;border-radius:8px;overflow:hidden}
.sk-prev i{position:absolute;display:block}

/* tab bar */
#tabs{flex:none;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;background:var(--bg);border-top:1px solid var(--line);margin-inline:-16px;padding:4px 16px max(4px,env(safe-area-inset-bottom,0px))}
#tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;font-size:11px;font-weight:600;color:var(--muted)}
#tabs button.on{color:var(--accent)}

/* sheet */
#sheet{position:fixed;inset:0;z-index:20;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.45)}
#sheet.open{display:flex}
.sheetbox{width:100%;max-width:520px;max-height:94%;overflow-y:auto;background:var(--bg);border-radius:16px 16px 0 0;padding:18px 16px max(20px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:10px;background:var(--surface);border:2px solid var(--line);font-size:12px;text-align:center;color:var(--muted);min-width:0}
.act span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.act.on{border-color:var(--accent);background:var(--accent-soft);color:var(--fg)}
.datefields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
@media (max-width:380px){.arow{grid-template-columns:22px minmax(0,1fr) 80px 36px}.kpi b{font-size:22px}}

/* ===== Liquid Glass: sky blue, translucent, light on edges. Blur only on a few large surfaces; list items stay cheap. ===== */
[data-skin="glass"] body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  radial-gradient(62% 38% at 12% 6%,var(--b1) 0,transparent 72%),
  radial-gradient(52% 38% at 94% 18%,var(--b2) 0,transparent 72%),
  radial-gradient(62% 42% at 86% 88%,var(--b3) 0,transparent 72%),
  radial-gradient(56% 38% at 4% 82%,var(--b4) 0,transparent 72%)}
[data-skin="glass"] body{letter-spacing:-.005em}
[data-skin="glass"] h2{font-size:22px;letter-spacing:-.02em}
[data-skin="glass"] .brand{font-size:38px;line-height:1.05;letter-spacing:-.035em}
[data-skin="glass"] .today{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
[data-skin="glass"] .orb{display:grid;width:46px;height:46px;border-radius:50%;place-items:center;flex:none;color:var(--accent);
  background:var(--glass-hi);border:1px solid var(--glass-edge);box-shadow:inset 0 1px 0 var(--glass-edge),0 8px 22px var(--glass-shadow)}
[data-skin="glass"] .card,[data-skin="glass"] .banner{background:var(--glass);border:1px solid var(--glass-edge);position:relative;isolation:isolate;

function pad(n){return n<10?'0'+n:''+n;}
function dkey(t){var d=new Date(t);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function sod(t){var d=new Date(t);d.setHours(0,0,0,0);return d;}
function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x;}
function mondayOf(d){var x=sod(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return x;}
function toLocalInput(t){var d=new Date(t);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes());}
var F_DAY=new Intl.DateTimeFormat('es',{weekday:'long',day:'numeric',month:'long'});
var F_DAYS=new Intl.DateTimeFormat('es',{day:'numeric',month:'short'});

var F_MONTH=new Intl.DateTimeFormat('es',{month:'long',year:'numeric'});
var F_MON=new Intl.DateTimeFormat('es',{month:'short'});
function dayLabel(k){
  var t=dkey(Date.now()),y=dkey(addDays(new Date(),-1).getTime());
  if(k===t)return 'Hoy';if(k===y)return 'Ayer';
  var p=k.split('-');return F_DAY.format(new Date(+p[0],+p[1]-1,+p[2]));
}
function num(x,d){return (Math.round(x*Math.pow(10,d||1))/Math.pow(10,d||1)).toFixed(d||1).replace('.',',');}

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function seed(){
  var rnd=mulberry(11),now=Date.now(),out=[];
  var bonus={ejercicio:.8,amigos:.7,aire:.6,meditar:.5,dormir:.7,pareja:.5,trabajo:-.5,compras:-.1};
  var notes=['Día tranquilo.','Mucho trabajo pero salió bien.','Paseo largo al atardecer.','Me costó arrancar.','Cena con amigos, risas.','Dormí poco.','','','',''];
  for(var i=0;i<21;i++){
    var n=rnd()<.3?2:1;
    for(var j=0;j<n;j++){
      var pool=DEFAULT_ACTS.slice().sort(function(){return rnd()-.5;}).slice(0,2+Math.floor(rnd()*3));
      var b=0;pool.forEach(function(a){b+=bonus[a.id]||0;});
      var mood=Math.max(1,Math.min(5,Math.round(3+(rnd()-.45)*2.2+b*.9)));
      var ts=sod(addDays(new Date(),-i)).getTime()+(j?20:9+Math.floor(rnd()*4))*3600000+Math.floor(rnd()*3600000);
      if(ts>now)ts=now-3600000*(1+j);
      out.push({id:'e'+i+'_'+j,ts:ts,mood:mood,acts:pool.map(function(a){return a.id;}),note:notes[Math.floor(rnd()*notes.length)],ex:true});
    }
  }
  return out;
}

var STL=[[25,'Bajo','#30A46C'],[50,'Moderado','#F5B800'],[75,'Alto','#F76B15'],[101,'Muy alto','#E5484D']];

function stCtx(){
  var evs=S.events.filter(function(x){return /^\d{4}-\d\d-\d\d$/.test(x.date);}).map(function(x){
    var w=({exam:3,delivery:2,task:1,class:.5}[x.type]||1)*(x.prio===2?1.5:x.prio===0?.75:1);
    return {x:x,w:w,ramp:x.type==='exam'?10:x.type==='delivery'?7:5,dd:dayDiff(x.date)};

}
function stOne(e,off){
  var dist=e.dd-off;
  if(e.x.done)return (off<0&&dist>=0&&dist<e.ramp)?e.w*(1-dist/e.ramp):0;

}

/* ---------- pomodoro ---------- */
var PH={work:['Concentración','var(--accent)'],short:['Descanso corto','var(--m3)'],long:['Descanso largo','var(--m2)']};

  var d={work:25,short:5,long:15,every:4,auto:false,sound:true,notify:false},k;

  S.pomo.long=Math.max(1,Math.min(90,Math.round(S.pomo.long)));S.pomo.every=Math.max(2,Math.min(8,Math.round(S.pomo.every)));

  }catch(e){}
}

function pTick(){

async function zipEntries(file){
  var n=file.size,tail=await file.slice(Math.max(0,n-65557),n).arrayBuffer(),v=new DataView(tail),i;

  var cd=new DataView(await file.slice(cdOff,cdOff+cdSize).arrayBuffer()),p=0,out=[],dec=new TextDecoder();
  for(var k=0;k<cnt;k++){

function moodState(days){

  var l7=cur.filter(function(e){return e.ts>=end-7*864e5;});r.avg7=l7.length>=2?mean(mo(l7)):null;
  var by={};cur.forEach(function(e){var k=dkey(e.ts);(by[k]=by[k]||[]).push(e.mood);});
  var dv=Object.keys(by).map(function(k){return mean(by[k]);});
  r.active=dv.length;r.cov=Math.min(1,dv.length/days);r.sd=sdev(dv);

  r.lowStreak=st;

  r.sc=[];S.scales.forEach(function(sc){
    var cv=[],pv=[];cur.forEach(function(e){if(e.sc&&e.sc[sc.id])cv.push(e.sc[sc.id]);});prev.forEach(function(e){if(e.sc&&e.sc[sc.id])pv.push(e.sc[sc.id]);});

  for(var k=0;k<b.length;k++)u[k]=b.charCodeAt(k);
  return new Blob([u],{type:meta.split(';')[0]});
}
function importMedia(list,done){
  var arr=(list||[]).filter(function(r){return r&&r.id&&typeof r.data==='string'&&r.data.indexOf('data:')===0;}),n=0;
  (function next(){
    var r=arr.shift();
    if(!r){done(n);return;}
    mGet('m',String(r.id),function(ex){
      if(ex){next();return;}
      var b;try{b=dataUrlToBlob(r.data);}catch(e){next();return;}
      var k=r.k==='v'?'v':'i',rec={id:String(r.id),k:k,type:b.type,name:String(r.name||'').slice(0,80),blob:b,size:b.size,w:r.w||0,dur:r.dur||0};
      var fin=function(th){mPut(rec,th,function(ok){if(ok)n++;next();});};
      if(k==='i')loadImg(b,function(src,w,h,free){if(!src){fin(null);return;}canvasBlob(src,w,h,360,.75,function(t){free();fin(t);});});
      else procVideo(b,function(x){fin(x.thumb);});
    });
  })();
}

/* ---------- command palette & quick search (Cmd/Ctrl + K) ---------- */
function getCmdItems(query){
  var q=(query||'').trim().toLowerCase(),items=[];
  // Acciones y navegación directa
  var actions=[
    {cat:'Acciones',icon:'plus',name:'Nueva entrada rápida',desc:'Registrar ánimo y nota del momento',act:'quickNew',k:'⌘N'},
    {cat:'Navegación',icon:'home',name:'Ir a Inicio',desc:'Resumen y widgets del día',act:'navTab',tab:'home'},
    {cat:'Navegación',icon:'list',name:'Ir a Agenda',desc:'Tareas, exámenes y entregas',act:'navTab',tab:'agenda'},
    {cat:'Navegación',icon:'clock',name:'Ir a Horario',desc:'Clases semanales y aulas',act:'navTab',tab:'sched'},
    {cat:'Navegación',icon:'wave',name:'Ir a Entradas de ánimo',desc:'Historial cronológico de registros',act:'navTab',tab:'log'},
    {cat:'Navegación',icon:'cal',name:'Ir a Calendario',desc:'Vista mensual y puntos de ánimo',act:'navTab',tab:'cal'},
    {cat:'Navegación',icon:'stats',name:'Ir a Estadísticas',desc:'Gráficos y rachas',act:'navTab',tab:'stats'},
    {cat:'Navegación',icon:'brain',name:'Estado anímico',desc:'Diagnóstico y patrones de los últimos 14 días',act:'navTab',tab:'mood'},
    {cat:'Navegación',icon:'school',name:'Asignaturas',desc:'Gestión de asignaturas escolares',act:'navTab',tab:'subj'},
    {cat:'Navegación',icon:'users',name:'Profesores',desc:'Directorio de profesores y despachos',act:'navTab',tab:'teach'},
    {cat:'Navegación',icon:'timer',name:'Pomodoro',desc:'Temporizador de estudio por bloques',act:'navTab',tab:'pomo'},
    {cat:'Navegación',icon:'flag',name:'Faltas y retrasos',desc:'Contador y alertas de asistencia',act:'navTab',tab:'abs'},
    {cat:'Navegación',icon:'gear',name:'Ajustes',desc:'Temas, actividades, datos y copias',act:'navTab',tab:'set'},
    {cat:'Acciones',icon:'sliders',name:'Personalizar widgets de inicio',desc:'Configurar orden y qué mostrar en Inicio',act:'editHome'}
  ];
  actions.forEach(function(a){
    if(!q||a.name.toLowerCase().indexOf(q)>-1||a.desc.toLowerCase().indexOf(q)>-1||a.cat.toLowerCase().indexOf(q)>-1){
      items.push(a);
    }
  });

  // Búsqueda en Asignaturas
  if(S.subjects&&S.subjects.length){
    S.subjects.forEach(function(s){
      if(!q||s.name.toLowerCase().indexOf(q)>-1||(s.room&&s.room.toLowerCase().indexOf(q)>-1)){
        items.push({cat:'Asignaturas',icon:s.icon||'book',name:s.name,desc:(s.room?'Aula '+s.room:'Asignatura')+(s.teacher?' · con '+((teachById(s.teacher)||{}).name||''):''),act:'openSubj',id:s.id,color:s.color});
      }
    });
  }

  // Búsqueda en Tareas y Eventos de agenda
  if(S.events&&S.events.length){
    S.events.slice(0,25).forEach(function(ev){
      var t=EVT[ev.type]||{n:'Tarea',i:'check'};
      if(!q||ev.title.toLowerCase().indexOf(q)>-1||(ev.note&&ev.note.toLowerCase().indexOf(q)>-1)){
        items.push({cat:'Agenda',icon:t.i,name:ev.title,desc:t.n+' · '+dayLabel(ev.date)+(ev.done?' (Hecho)':' (Pendiente)'),act:'openEv',id:ev.id});
      }
    });
  }

  // Búsqueda en Notas de entradas recientes
  if(q&&S.entries&&S.entries.length){
    var nMatches=0;
    S.entries.forEach(function(e){
      if(nMatches>=10)return;
      var text=((e.title||'')+' '+(e.note||'')).toLowerCase();
      if(text.indexOf(q)>-1){
        nMatches++;
        items.push({cat:'Entradas de ánimo',icon:'wave',name:(e.title||(e.note?e.note.slice(0,40)+'...':'Entrada sin nota')),desc:dayLabel(dkey(e.ts))+' · Ánimo: '+MOODS[e.mood].n,act:'openEntry',id:e.id});
      }
    });
  }

  return items;
}
function openCmdPal(){
  ui.cmdQ='';ui.cmdSel=0;
  $cmdPal.classList.add('open');
  renderCmdPal();
  setTimeout(function(){var inp=document.getElementById('cmdInput');if(inp){inp.focus();inp.select();}},50);
}
function closeCmdPal(){
  $cmdPal.classList.remove('open');
  $cmdPal.innerHTML='';
}
function renderCmdPal(){
  var items=getCmdItems(ui.cmdQ);
  if(ui.cmdSel>=items.length)ui.cmdSel=Math.max(0,items.length-1);
  var h='<div class="cmdbox" role="dialog" aria-label="Búsqueda rápida y comandos">'+
    '<div class="cmdtop">'+ic('search',20)+'<input id="cmdInput" placeholder="Buscar o escribir un comando..." value="'+esc(ui.cmdQ)+'" autocomplete="off" spellcheck="false">'+
    '<kbd>Esc para cerrar</kbd><button class="iconbtn" data-a="cmdClose" style="width:30px;height:30px" aria-label="Cerrar">'+ic('x',16)+'</button></div>'+
    '<div class="cmdlist" id="cmdList">';
  if(!items.length){
    h+='<div class="empty" style="padding:24px 12px">No se encontraron resultados para «'+esc(ui.cmdQ)+'».</div>';
  }else{
    var lastCat='';
    items.forEach(function(item,i){
      if(item.cat!==lastCat){
        h+='<div class="cmdsec">'+esc(item.cat)+'</div>';
        lastCat=item.cat;
      }
      var isSel=i===ui.cmdSel;
      h+='<button class="cmditem'+(isSel?' sel':'')+'" data-a="cmdExec" data-i="'+i+'" role="option" aria-selected="'+isSel+'">'+
        '<span class="sbadge" style="width:32px;height:32px;border-radius:8px;background:'+(item.color||'var(--surface2)')+';color:'+(item.color?'#fff':'var(--accent)')+'">'+ic(item.icon||'search',18)+'</span>'+
        '<span class="mid"><b>'+esc(item.name)+'</b>'+(item.desc?'<span class="small muted">'+esc(item.desc)+'</span>':'')+'</span>'+
        (item.k?'<kbd>'+item.k+'</kbd>':'')+ic('right',16)+'</button>';
    });
  }
  h+='</div></div>';
  $cmdPal.innerHTML=h;
}
function execCmdItem(item){
  closeCmdPal();
  if(!item)return;
  if(item.act==='quickNew')openEditor({});
  else if(item.act==='navTab'){ui.tab=item.tab;render();}
  else if(item.act==='editHome')openHomeEditor();
  else if(item.act==='openSubj')openForm('subj',item.id);
  else if(item.act==='openEv')openEv(item.id);
  else if(item.act==='openEntry'){var e=S.entries.filter(function(x){return x.id===item.id;})[0];if(e)openEditor({entry:e});}
}

/* ---------- school: weekly timetable ---------- */
var DN=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'],DF=['lunes','martes','miércoles','jueves','viernes','sábado','domingo'];
function tmin(t){var p=String(t||'').split(':');return (+p[0])*60+(+p[1]||0);}
function tfmt(m){return pad(Math.floor(m/60))+':'+pad(m%60);}
function wdayOf(d){return (new Date(d).getDay()+6)%7;}
function curWeek(){
  if(!S.sched.ab)return '';
  var n=Math.round((mondayOf(new Date())-mondayOf(new Date(S.sched.ref)))/(7*864e5));
  return (((n%2)+2)%2)===0?'A':'B';
}
function viewWk(){return S.sched.ab?(ui.schWk||curWeek()):'';}
function clsFor(day,wk){
  return S.classes.filter(function(c){return (day===null||c.day===day)&&(!S.sched.ab||!c.week||c.week===wk)&&subjById(c.sid);}).sort(function(a,b){return a.day-b.day||tmin(a.start)-tmin(b.start);});
}
function schDay(){
  if(ui.schDay!==undefined&&ui.schDay!==null&&ui.schDay<S.sched.days)return ui.schDay;
  var w=wdayOf(Date.now());return w<S.sched.days?w:0;
}
function clsRow(c,now){
  var sj=subjById(c.sid),t=sj.teacher?teachById(sj.teacher):null,sub=[c.room?('Aula '+c.room):'',t?t.name:''].filter(Boolean).join(' · ');
  var live=now&&tmin(c.start)<=now&&now<tmin(c.end);
  return '<button class="card crow" style="--cc:'+esc(sj.color)+'" data-a="editCls" data-v="'+esc(c.id)+'"><span class="ctime"><b>'+esc(c.start)+'</b><span class="small muted">'+esc(c.end)+'</span></span><span class="mid"><b>'+esc(sj.name)+'</b>'+(sub?'<span class="small muted">'+esc(sub)+'</span>':'')+'</span>'+(live?'<span class="nowbadge">Ahora</span>':'')+(S.sched.ab&&c.week?'<span class="chip">'+esc(c.week)+'</span>':'')+'</button>';
}
function weekGrid(wk){
  var nd=S.sched.days,cls=clsFor(null,wk).filter(function(c){return c.day<nd;});
  var lo=8,hi=15;
  cls.forEach(function(c){lo=Math.min(lo,Math.floor(tmin(c.start)/60));hi=Math.max(hi,Math.ceil(tmin(c.end)/60));});
  var hp=52,px=hp/60,H=(hi-lo)*hp,td=wdayOf(Date.now()),h='<div class="wg" style="--nd:'+nd+';--hp:'+hp+'px"><div class="wgh"><div></div>';
  for(var d=0;d<nd;d++)h+='<div class="'+(d===td?'td':'')+'">'+DN[d]+'</div>';
  h+='</div><div class="wgb" style="height:'+H+'px"><div class="wgax">';
  for(var k=1;k<hi-lo;k++)h+='<span style="top:'+(k*hp)+'px">'+pad(lo+k)+'</span>';
  h+='</div>';
  for(var d2=0;d2<nd;d2++){
    h+='<div class="wgc'+(d2===td?' td':'')+'">'+cls.filter(function(c){return c.day===d2;}).map(function(c){
      var sj=subjById(c.sid),top=(tmin(c.start)-lo*60)*px,ht=Math.max(18,(tmin(c.end)-tmin(c.start))*px-2);
      return '<button class="cb" style="top:'+top+'px;height:'+ht+'px;background:'+esc(sj.color)+'" data-a="editCls" data-v="'+esc(c.id)+'" aria-label="'+esc(sj.name+' '+DF[c.day]+' '+c.start+' a '+c.end)+'"><b>'+esc(sj.name)+'</b>'+(c.room&&ht>34?'<span>'+esc(c.room)+'</span>':'')+'</button>';
    }).join('')+'</div>';
  }
  return h+'</div></div>';
}

    '<button class="btn sm ghost" data-a="schAB" aria-pressed="'+S.sched.ab+'">'+(S.sched.ab?'Semanas A/B: activadas':'Semanas A/B: desactivadas')+'</button>'+

  return h;

function readCls(){
  var g=function(id){var e=document.getElementById(id);return e?e.value:null;},v;
  if((v=g('fcSubj'))!==null)fo.sid=v;if((v=g('fcS'))!==null)fo.start=v;if((v=g('fcE'))!==null)fo.end=v;if((v=g('fcRoom'))!==null)fo.room=v;if((v=g('fcWeek'))!==null)fo.week=v;if((v=g('fNote'))!==null)fo.note=v;
}
function saveCls(){
  readCls();var err=document.getElementById('fErr');
  if(!subjById(fo.sid)){err.textContent='Elige una asignatura.';return;}
  if(!fo.days.length){err.textContent='Elige al menos un día.';return;}
  if(!/^\d\d:\d\d$/.test(fo.start)||!/^\d\d:\d\d$/.test(fo.end)){err.textContent='Indica la hora de inicio y de fin.';return;}
  var a=tmin(fo.start),b=tmin(fo.end);
  if(b<=a){err.textContent='La hora de fin debe ser posterior a la de inicio.';return;}
  for(var i=0;i<fo.days.length;i++){
    var d=fo.days[i];
    var clash=S.classes.filter(function(c){return c.id!==fo.id&&c.day===d&&(!fo.week||!c.week||c.week===fo.week)&&tmin(c.start)<b&&a<tmin(c.end)&&subjById(c.sid);})[0];
    if(clash){err.textContent='El '+DF[d]+' se solapa con '+subjById(clash.sid).name+' ('+clash.start+'–'+clash.end+').';return;}
  }
  var base={sid:fo.sid,start:fo.start,end:fo.end,room:fo.room.trim().slice(0,30),week:S.sched.ab?fo.week:'',note:fo.note.trim().slice(0,500)};
  if(fo.id){S.classes.forEach(function(c){if(c.id===fo.id){Object.assign(c,base,{day:fo.days[0]});}});}
  else fo.days.forEach(function(d){S.classes.push(Object.assign({id:nid('c'),day:d},base));});
  ui.schDay=fo.days[0];
  save();closeEditor();render(true);
}

/* forms in the sheet */

                  :{type:type,id:id||null,name:o?o.name:'',email:o?(o.email||''):'',phone:o?(o.phone||''):'',office:o?(o.office||''):'',note:o?(o.note||''):'',del:false};

  }else{

function readForm(){
  if(fo.type==='per'){readPer();return;}
  if(fo.type==='ev'){readEv();return;}
  if(fo.type==='abs'){readAbs();return;}
  if(fo.type==='cls'){readCls();return;}
  var g=function(id){var e=document.getElementById(id);return e?e.value:null;};
  var v;
  if((v=g('fName'))!==null)fo.name=v;if((v=g('fNote'))!==null)fo.note=v;
  if(fo.type==='subj'){if((v=g('fTeach'))!==null)fo.teacher=v;if((v=g('fRoom'))!==null)fo.room=v;if((v=g('fTotal'))!==null)fo.total=v;if((v=g('fMax'))!==null)fo.maxPct=v;}
  else{if((v=g('fEmail'))!==null)fo.email=v;if((v=g('fPhone'))!==null)fo.phone=v;if((v=g('fOffice'))!==null)fo.office=v;}
}
function saveForm(){
  if(fo.type==='per'){savePer();return;}
  if(fo.type==='ev'){saveEv();return;}
  if(fo.type==='abs'){saveAbs();return;}
  if(fo.type==='cls'){saveCls();return;}
  readForm();var name=fo.name.trim(),err=document.getElementById('fErr');
  if(!name){err.textContent='Escribe un nombre.';return;}
  var isS=fo.type==='subj',list=isS?S.subjects:S.teachers,o=fo.id?(isS?subjById(fo.id):teachById(fo.id)):null;
  if(!o){o={id:nid(isS?'s':'t')};list.push(o);}
  o.name=name.slice(0,60);o.note=fo.note.trim().slice(0,2000);
  if(isS){o.color=fo.color;o.icon=ICONS[fo.icon]?fo.icon:'book';o.teacher=fo.teacher&&teachById(fo.teacher)?fo.teacher:'';o.room=fo.room.trim().slice(0,30);o.total=Math.max(0,Math.min(999,Math.round(+fo.total)||0));o.maxPct=Math.max(0,Math.min(100,Math.round(+fo.maxPct)||0));}
  else{o.email=fo.email.trim().slice(0,120);o.phone=fo.phone.trim().slice(0,30);o.office=fo.office.trim().slice(0,30);}
  save();closeEditor();render(true);
}
function delForm(){
  if(fo.type==='per'){delPer();return;}
  if(fo.type==='ev'){delEv();return;}
  if(fo.type==='abs'){delAbs();return;}
  if(fo.type==='cls'){
    if(!fo.del){fo.del=true;readCls();renderForm();return;}
    var cid=fo.id;S.classes=S.classes.filter(function(c){return c.id!==cid;});save();closeEditor();render(true);return;
  }
  if(!fo.del){fo.del=true;readForm();renderForm();return;}
  var id=fo.id;
  if(fo.type==='subj'){S.subjects=S.subjects.filter(function(x){return x.id!==id;});S.classes=S.classes.filter(function(c){return c.sid!==id;});S.events.forEach(function(x){if(x.sid===id)x.sid='';});S.absences=S.absences.filter(function(a){return a.sid!==id;});}
  else{S.teachers=S.teachers.filter(function(x){return x.id!==id;});S.subjects.forEach(function(x){if(x.teacher===id)x.teacher='';});}
  save();closeEditor();render(true);
}

/* goals + reminder */
function periodStart(per){var n=new Date();return per==='week'?mondayOf(n).getTime():new Date(n.getFullYear(),n.getMonth(),1).getTime();}
function goalDone(g){
  var from=periodStart(g.per),days={};
  S.entries.forEach(function(e){if(e.ts>=from&&(g.act==='any'||e.acts.indexOf(g.act)>-1))days[dkey(e.ts)]=1;});
  return Object.keys(days).length;
}
function goalName(g){if(g.act==='any')return 'Registrar mi ánimo';var a=actById(g.act);return a?a.name:null;}
function goalRow(g){
  var nm=goalName(g);if(!nm)return '';
  var d=goalDone(g),p=Math.min(100,Math.round(d/g.n*100)),ok=d>=g.n,a=g.act==='any'?null:actById(g.act);
  return '<div class="stack" style="gap:6px"><div class="row between" style="flex-wrap:wrap;gap:4px 10px"><span class="row" style="gap:8px;min-width:0">'+(a?ic(a.icon,20):ic('wave',20))+'<b style="overflow-wrap:anywhere">'+esc(nm)+'</b></span><span class="small muted" style="white-space:nowrap">'+(ok?'Cumplido · ':'')+d+'/'+g.n+' días '+(g.per==='week'?'esta semana':'este mes')+'</span></div><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="'+g.n+'" aria-valuenow="'+Math.min(d,g.n)+'"><i style="width:'+p+'%;background:'+(ok?'var(--m3)':'var(--accent)')+'"></i></div></div>';
}
function goalsCard(){
  var rows=S.goals.map(goalRow).filter(Boolean);
  if(!rows.length)return '';
  return '<section class="card stack" aria-label="Objetivos"><h3>Objetivos</h3>'+rows.join('')+'</section>';
}
function reminderDue(){
  var r=S.reminder;if(!r||!r.on)return false;
  var t=(r.time||'21:00').split(':'),n=new Date(),lim=new Date(n.getFullYear(),n.getMonth(),n.getDate(),+t[0],+t[1]).getTime();
  if(Date.now()<lim)return false;
  var k=dkey(Date.now());
  return !S.entries.some(function(e){return dkey(e.ts)===k;});
}
function reminderBanner(){

function filtered(){

    return (!ui.fx||(e.m&&e.m.length))&&(!ui.fm.length||ui.fm.indexOf(e.mood)>-1)&&(!ui.fa||e.acts.indexOf(ui.fa)>-1)&&(!q||((e.title||'')+' '+(e.note||'')).toLowerCase().indexOf(q)>-1);
  });

function filtersOn(){return !!((ui.fq||'').trim()||ui.fm.length||ui.fa||ui.fx);}
function refreshList(){
  var tl=document.getElementById('tl'),fc=document.getElementById('fcount');
  if(!tl||!fc)return;
  var list=filtered(),groups={},order=[],h='';
  if(!list.length)h='<div class="empty">Ninguna entrada coincide con los filtros.</div>';

var cAvg=null,cAvgV=-1;
function dayAvg(){
  if(cAvgV===ver)return cAvg;
  var m={};S.entries.forEach(function(e){var k=dkey(e.ts);(m[k]=m[k]||[]).push(e.mood);});
  var r={};Object.keys(m).forEach(function(k){r[k]=m[k].reduce(function(a,b){return a+b;},0)/m[k].length;});
  cAvg=r;cAvgV=ver;return r;
}
function vYear(avg){
  var y=ui.calY,todayK=dkey(Date.now()),days=0,sum=0,cnt=0;
  Object.keys(avg).forEach(function(k){if(k.indexOf(y+'-')===0){days++;}});
  S.entries.forEach(function(e){if(new Date(e.ts).getFullYear()===y){cnt++;sum+=e.mood;}});
  var h=header()+calSeg();
  h+='<div class="cal-head"><button class="iconbtn" data-a="yearPrev" aria-label="Año anterior">'+ic('left')+'</button><div class="month">'+y+'</div><button class="iconbtn" data-a="yearNext" aria-label="Año siguiente">'+ic('right')+'</button></div>';
  h+='<div class="card kpis"><div class="kpi"><b>'+cnt+'</b><span>Entradas</span></div><div class="kpi"><b>'+days+'</b><span>Días con registro</span></div><div class="kpi"><b>'+(cnt?num(sum/cnt):'–')+'</b><span>Ánimo medio</span></div></div>';
  var F_N=new Intl.DateTimeFormat('es',{month:'narrow'});
  h+='<div class="card stack"><div class="ygrid" role="group" aria-label="Año '+y+' día a día"><span></span>';
  for(var m=0;m<12;m++)h+='<span class="yl">'+esc(F_N.format(new Date(y,m,1)).toUpperCase())+'</span>';
  for(var d=1;d<=31;d++){
    h+='<span class="yl">'+d+'</span>';
    for(var mo=0;mo<12;mo++){
      if(d>new Date(y,mo+1,0).getDate()){h+='<i class="nx"></i>';continue;}
      var k=y+'-'+pad(mo+1)+'-'+pad(d),a=avg[k];
      h+='<button data-a="yearDay" data-v="'+k+'"'+(a?' style="background:var(--m'+Math.round(a)+')"':'')+(k===todayK?' class="now"':'')+' aria-label="'+d+'/'+(mo+1)+(a?', ánimo medio '+num(a):', sin registro')+'"></button>';
    }
  }
  h+='</div><div class="legend">'+[1,2,3,4,5].map(function(v){return '<span class="row" style="gap:5px"><i style="background:var(--m'+v+');width:14px;height:14px;border-radius:5px;display:inline-block"></i>'+MOODS[v].n+'</span>';}).join('')+'</div></div>';
  return h;
}
function calSeg(){
  return '<div class="seg" style="grid-template-columns:repeat(2,1fr)" role="group" aria-label="Vista"><button data-a="calMode" data-v="month" class="'+(ui.calMode==='month'?'on':'')+'">Mes</button><button data-a="calMode" data-v="year" class="'+(ui.calMode==='year'?'on':'')+'">Año</button></div>';
}
function vCal(){
  var avg=dayAvg(),cnts={};S.entries.forEach(function(e){var kk=dkey(e.ts);cnts[kk]=(cnts[kk]||0)+1;});
  if(ui.calMode==='year')return vYear(avg);
  var evMap=evByDay();
  var y=ui.calY,mo=ui.calM,first=new Date(y,mo,1),off=(first.getDay()+6)%7,days=new Date(y,mo+1,0).getDate();
  var todayK=dkey(Date.now()),now=Date.now();
  var h=header()+calSeg();
  h+='<div class="cal-head"><button class="iconbtn" data-a="calPrev" aria-label="Mes anterior">'+ic('left')+'</button><div class="month">'+esc(F_MONTH.format(first))+'</div><button class="iconbtn" data-a="calNext" aria-label="Mes siguiente">'+ic('right')+'</button></div>';
  var mEnt=S.entries.filter(function(e){var dd=new Date(e.ts);return dd.getFullYear()===y&&dd.getMonth()===mo;});
  h+='<p class="muted small" style="margin:0">'+(mEnt.length?mEnt.length+(mEnt.length===1?' entrada':' entradas')+' · ánimo medio '+num(mEnt.reduce(function(t,e){return t+e.mood;},0)/mEnt.length):'Sin entradas este mes')+'</p>';
  h+='<div class="card stack"><div class="grid7">'+['L','M','X','J','V','S','D'].map(function(d){return '<div class="dow">'+d+'</div>';}).join('');
  for(var i=0;i<off;i++)h+='<div class="cell blank"></div>';
  for(var d=1;d<=days;d++){
    var k=y+'-'+pad(mo+1)+'-'+pad(d),a=avg[k],cls='cell',st='';
    if(a){cls+=' has';st=' style="background:var(--m'+Math.round(a)+')"';}
    if(k===todayK)cls+=' now';

/* stats */
function buckets(range){
  var out=[],end=sod(new Date()),i,d,e;
  if(range<=30){for(i=range-1;i>=0;i--){d=addDays(end,-i);out.push({s:d.getTime(),e:addDays(d,1).getTime(),l:F_DAYS.format(d)});}}
  else if(range===90){var mon=mondayOf(end);for(i=12;i>=0;i--){d=addDays(mon,-7*i);out.push({s:d.getTime(),e:addDays(d,7).getTime(),l:F_DAYS.format(d)});}}
  else{for(i=11;i>=0;i--){d=new Date(end.getFullYear(),end.getMonth()-i,1);e=new Date(end.getFullYear(),end.getMonth()-i+1,1);out.push({s:d.getTime(),e:e.getTime(),l:F_MON.format(d)});}}
  return out;
}
function streaks(){
  var ks={};S.entries.forEach(function(e){ks[dkey(e.ts)]=1;});
  var cur=0,d=sod(new Date());
  if(!ks[dkey(d.getTime())])d=addDays(d,-1);
  while(ks[dkey(d.getTime())]){cur++;d=addDays(d,-1);}
  var days=Object.keys(ks).sort(),best=0,run=0,prev=null;
  days.forEach(function(k){var p=k.split('-'),t=new Date(+p[0],+p[1]-1,+p[2]).getTime();
    if(prev!==null&&Math.round((t-prev)/86400000)===1)run++;else run=1;
    if(run>best)best=run;prev=t;});
  return {cur:cur,best:best};
}
function chartSvg(bks,list){
  var W=340,H=176,L=20,R=4,T=8,B=22,pw=W-L-R,ph=H-T-B,n=bks.length,slot=pw/n,bw=Math.max(3,slot*.68);
  function y(v){return T+ph*(1-v/5);}
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Ánimo medio por periodo">';
  for(var v=1;v<=5;v++)s+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'"/><text x="'+(L-6)+'" y="'+(y(v)+3.5)+'" text-anchor="end">'+v+'</text>';
  bks.forEach(function(b,i){
    var arr=list.filter(function(e){return e.ts>=b.s&&e.ts<b.e;});
    if(!arr.length)return;
    var a=arr.reduce(function(t,e){return t+e.mood;},0)/arr.length,x=L+slot*i+(slot-bw)/2;
    s+='<rect x="'+x.toFixed(1)+'" y="'+y(a).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+(y(0)-y(a)).toFixed(1)+'" rx="'+Math.min(4,bw/2).toFixed(1)+'" fill="var(--m'+Math.round(a)+')"/>';
  });
  s+='<text x="'+L+'" y="'+(H-5)+'">'+esc(bks[0].l)+'</text><text x="'+(W-R)+'" y="'+(H-5)+'" text-anchor="end">'+esc(bks[n-1].l)+'</text></svg>';
  return s;
}

var DY_CATS={emociones:'Emociones',sueno:'Sueño',tiempo:'Tiempo'};
var DY_MOOD={'increible':5,'rad':5,'bien':4,'good':4,'meh':3,'mal':2,'bad':2,'horrible':1,'awful':1};
function plain(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();}
function parseCSV(t){
  if(t.charCodeAt(0)===0xFEFF)t=t.slice(1);
  var rows=[],row=[],f='',q=false,c;
  for(var i=0;i<t.length;i++){
    c=t.charAt(i);
    if(q){if(c==='"'){if(t.charAt(i+1)==='"'){f+='"';i++;}else q=false;}else f+=c;}
    else if(c==='"')q=true;
    else if(c===','){row.push(f);f='';}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t.charAt(i+1)==='\n')i++;row.push(f);f='';rows.push(row);row=[];}
    else f+=c;
  }
  if(f!==''||row.length){row.push(f);rows.push(row);}
  return rows.filter(function(r){return r.length>1||(r[0]||'')!=='';});
}
function cleanNote(s){
  return String(s||'').replace(/<br\s*\/?>/gi,'\n').replace(/<\/(p|div)>/gi,'\n').replace(/<[^>]+>/g,'')
    .replace(/&nbsp;/g,' ').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&amp;/g,'&')
    .replace(/ /g,' ').replace(/[ \t]+\n/g,'\n').replace(/\n{3,}/g,'\n\n').trim();
}
function ensureCat(id){
  if(S.cats.some(function(c){return c.id===id;}))return id;

  return 'otras';
}
function dyAct(name,stats){
  var key=name.toLowerCase(),m=DY_MAP[key],i,found;
  if(m&&m[2]&&actById(m[2]))return m[2];
  for(i=0;i<S.acts.length;i++)if(S.acts[i].name.toLowerCase()===key)return S.acts[i].id;
  var id='dy_'+(plain(name).replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'')||'x');
  found=actById(id);if(found)return id;
  var label=name.charAt(0).toUpperCase()+name.slice(1);
  S.acts.push({id:id,name:label.slice(0,24),icon:m&&ICONS[m[1]]?m[1]:'star',cat:m?ensureCat(m[0]):'otras'});touch();
  stats.newActs++;return id;
}
function doDaylio(text){
  var rows=parseCSV(String(text||''));
  if(rows.length<2){ui.dyMsg='El archivo está vacío o no es un CSV.';return false;}
  var head=rows[0].map(function(h){return plain(h);});
  var ix={};['full_date','time','mood','activities','scales','note_title','note'].forEach(function(k){ix[k]=head.indexOf(k);});
  if(ix.full_date<0||ix.mood<0){ui.dyMsg='No parece un CSV exportado desde Daylio.';return false;}
  var ids={};S.entries.forEach(function(e){ids[e.id]=1;});
  var sc0=S.scales.length,stats={add:0,dup:0,skip:0,newActs:0},g=function(r,k){return ix[k]>-1?(r[ix[k]]||''):'';},last=0;
  for(var n=1;n<rows.length;n++){
    var r=rows[n],dm=/^(\d{4})-(\d{2})-(\d{2})$/.exec(g(r,'full_date').trim()),tm=/^(\d{1,2}):(\d{2})/.exec(g(r,'time').trim()),mood=DY_MOOD[plain(g(r,'mood'))];
    if(!dm||!mood){stats.skip++;continue;}
    var ts=new Date(+dm[1],+dm[2]-1,+dm[3],tm?+tm[1]:12,tm?+tm[2]:0).getTime();
    if(isNaN(ts)){stats.skip++;continue;}
    var id='dy_'+ts;
    if(ids[id]){stats.dup++;continue;}
    var seen={},acts=[];
    g(r,'activities').split('|').forEach(function(a){a=a.trim();if(!a)return;var aid=dyAct(a,stats);if(!seen[aid]){seen[aid]=1;acts.push(aid);}});
    var en={id:id,ts:ts,mood:mood,acts:acts,note:cleanNote(g(r,'note')).slice(0,20000),title:cleanNote(g(r,'note_title')).slice(0,120)};
    var so=parseScales(g(r,'scales'));if(so)en.sc=so;
    ids[id]=1;S.entries.push(en);stats.add++;if(ts>last)last=ts;
  }
  var removed=0;
  if(stats.add>0){
    removed=S.entries.filter(function(e){return e.ex;}).length;
    S.entries=S.entries.filter(function(e){return !e.ex;});
    S.goals=S.goals.filter(function(x){return !x.ex;});
    var ld=new Date(last);ui.calY=ld.getFullYear();ui.calM=ld.getMonth();ui.calSel=dkey(last);
  }
  save();
  ui.dyMsg='Importadas '+stats.add+' entradas'+(stats.newActs?' y '+stats.newActs+' actividades nuevas':'')+'.'+(S.scales.length>sc0?' Escalas nuevas: '+S.scales.slice(sc0).map(function(x){return x.name;}).join(', ')+'.':'')+
    (stats.dup?' '+stats.dup+' ya estaban.':'')+(stats.skip?' '+stats.skip+' no se pudieron leer.':'')+(removed?' Se quitaron '+removed+' entradas de ejemplo.':'');
  return stats.add>0||stats.dup>0;
}

document.addEventListener('keydown',function(ev){
  // Manejo de lightbox
  if($lb.classList.contains('open')){
    if(ev.key==='Escape')closeLb();
    else if(ev.key==='ArrowLeft')lbGo(-1);
    else if(ev.key==='ArrowRight')lbGo(1);
    return;
  }

  // Manejo de paleta de comandos activa
  if($cmdPal&&$cmdPal.classList.contains('open')){
    var items=getCmdItems(ui.cmdQ);
    if(ev.key==='Escape'){ev.preventDefault();closeCmdPal();return;}
    if(ev.key==='ArrowDown'){
      ev.preventDefault();
      if(items.length){ui.cmdSel=(ui.cmdSel+1)%items.length;renderCmdPal();var el=document.getElementById('cmdInput');if(el)el.focus();}
      return;
    }
    if(ev.key==='ArrowUp'){
      ev.preventDefault();
      if(items.length){ui.cmdSel=(ui.cmdSel-1+items.length)%items.length;renderCmdPal();var el2=document.getElementById('cmdInput');if(el2)el2.focus();}
      return;
    }
    if(ev.key==='Enter'){
      ev.preventDefault();
      if(items.length&&items[ui.cmdSel]){execCmdItem(items[ui.cmdSel]);}
      return;
    }
  }

  // Cerrar editor / formulario con Escape
  if(ev.key==='Escape'&&(ed||fo||$sheet.classList.contains('open'))){closeEditor();return;}

  // Atajos con modificador Cmd o Ctrl
  var isMod=ev.metaKey||ev.ctrlKey;
  if(isMod){
    var k=ev.key.toLowerCase();
    // Cmd/Ctrl + K: Paleta de comandos y búsqueda global
    if(k==='k'){
      ev.preventDefault();
      if($cmdPal.classList.contains('open'))closeCmdPal();
      else openCmdPal();
      return;
    }
    // Cmd/Ctrl + N: Nueva entrada rápida
    if(k==='n'){
      ev.preventDefault();
      if($cmdPal.classList.contains('open'))closeCmdPal();
      openEditor({});
      return;
    }
  }

  // Teclas numéricas 1-5: Asignación rápida de nivel de ánimo
  // Solo cuando no estemos escribiendo en inputs, textareas o selects
  var tag=(ev.target&&ev.target.tagName)?ev.target.tagName.toLowerCase():'';
  var isEditing=tag==='input'||tag==='textarea'||tag==='select'||(ev.target&&ev.target.isContentEditable);
  if(!isEditing&&!ev.metaKey&&!ev.ctrlKey&&!ev.altKey){
    if(ev.key>='1'&&ev.key<='5'){
      var moodNum=+ev.key;
      // Si el editor de entrada está abierto, asignar el ánimo en el editor
      if(ed&&$sheet.classList.contains('open')){
        ev.preventDefault();
        ed.mood=moodNum;
        $sheet.querySelectorAll('[data-a="mood"]').forEach(function(b){b.classList.toggle('sel',b.getAttribute('data-v')===String(moodNum));});
        return;
      }
      // Si estamos en cualquier pantalla, abrir registro rápido con ese ánimo
      if(!ed&&!fo&&!$sheet.classList.contains('open')&&!$cmdPal.classList.contains('open')){
        ev.preventDefault();
        openEditor({mood:moodNum});
        return;
      }
    }
  }
});
